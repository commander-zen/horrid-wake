<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Horrid Wake</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Josefin+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/cards.css">
<link rel="stylesheet" href="styles/detail.css">
<link rel="stylesheet" href="styles/summerCamp.css">
<style>
.d-btn-chat{width:100%;padding:9px 11px;background:rgba(10,18,30,.5);border:1px solid rgba(40,70,110,.55);color:rgba(100,145,195,.8);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;text-align:left;}
.d-btn-chat:active{background:rgba(18,30,50,.65);border-color:rgba(60,100,155,.7);color:rgba(130,175,230,.9);}
.d-btn-sub--chat{color:rgba(100,145,195,.55);}
</style>
</head>
<body>
<canvas id="ec"></canvas>

<!-- SELECT -->
<div class="screen" id="selectScreen">
  <div class="s-bg"></div>
  <div class="s-vignette"></div>

  <div class="s-title">
    <h1>The Gang Goes on an Adventure</h1>

    <div class="s-rule"><div class="s-rule-line"></div><div class="s-rule-gem"></div><div class="s-rule-line"></div></div>
  </div>

  <div class="fire-wrap">
    <div class="fire-glow"></div>
    <svg class="flames" width="46" height="72" viewBox="0 0 46 72" fill="none">
      <path class="fo" d="M23 68C7 52 3 35 11 21c2 13 8 7 6-4 4 11 10 5 8-6 6 13 12 31 8 49z" fill="rgba(150,45,0,.52)"/>
      <path class="fm" d="M23 68c-12-16-13-31-7-44 2 8 6 4 5-2 3 8 7 4 6-3 4 10 10 27 7 43z" fill="rgba(228,102,0,.76)"/>
      <path class="fi" d="M23 68c-7-14-8-25-4-34 1 6 4 3 3-2 2 6 5 3 4-2 3 8 7 21 5 35z" fill="rgba(255,210,65,.94)"/>
      <ellipse cx="23" cy="67" rx="9" ry="4" fill="rgba(255,248,185,.7)"/>
    </svg>
    <div class="fire-coals"></div>
    <div class="fire-logs"></div>
  </div>

  <div class="chars-row" id="charsRow"></div>
  <div class="tap-hint" id="tapHint">Tap a champion to answer the call</div>
</div>

<!-- DETAIL -->
<div id="detailPanel">
  <div class="d-backdrop"></div>
  <div class="d-hero">
    <div class="d-hero-img" id="dHeroImg"></div>
    <div class="d-hero-overlay"></div>
  </div>
  <div class="d-card">
    <div class="d-name-row">
      <div class="d-name" id="dName" contenteditable="true" spellcheck="false"></div>
      <span class="d-name-hint">tap to rename</span>
    </div>
    <div class="d-cls" id="dCls"></div>
    <div class="d-tag" id="dTag"></div>
    <div class="d-identity" id="dIdentity"></div>
    <div class="d-btns">
      <button class="d-btn-back" onclick="closeDetail()">&#8592; Back</button>
      <div class="d-ctas">
        <div class="d-cta-wrap">
          <button class="d-btn-enter" onclick="enterDungeon()">VIEW CHARACTER SHEET</button>
          <div class="d-btn-sub">Jump straight to Level 5 &mdash; ready for the fall.</div>
        </div>
        <div class="d-cta-wrap">
          <button class="d-btn-camp" onclick="window.location.href='summer-camp.html?character='+activeId">&#127957; SUMMER CAMP</button>
          <div class="d-btn-sub d-btn-sub--camp">Play through Lost Mines of Phandelver with the gang, Levels 1&ndash;5.</div>
        </div>
        <div class="d-cta-wrap">
          <button class="d-btn-chat" onclick="enterGroupChat()">&#9876; GROUP CHAT</button>
          <div class="d-btn-sub d-btn-sub--chat">Async session &mdash; the DM responds to every message.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SHEET VIEW -->
<div id="sheetView">
  <div class="sh-topbar">
    <button class="sh-close" onclick="closeSheet()">&#10005;</button>
    <div class="sh-lvl-wrap">
      <button class="sh-lvl" id="shLvl1" onclick="setSheetLevel(1)">LEVEL 1</button>
      <button class="sh-lvl active" id="shLvl5" onclick="setSheetLevel(5)">LEVEL 5</button>
    </div>
  </div>
  <div class="sh-hero" id="shHero">
    <div class="sh-hero-img" id="shHeroImg"></div>
    <div class="sh-hero-fade"></div>
    <div class="sh-hero-info">
      <div class="sh-char-name" id="shCharName"></div>
      <div class="sh-class-line" id="shClassLine"></div>
    </div>
  </div>
  <div class="sh-body" id="shBody"></div>
</div>

<!-- SUMMER CAMP VIEW -->
<div id="summerCampView">
  <div class="sc-topbar">
    <button class="sc-close" onclick="closeSummerCamp()">&#10005;</button>
    <div class="sc-topbar-title">
      <span class="sc-top-name" id="scTopName"></span>
      <span class="sc-lvl-badge">LVL 1</span>
    </div>
  </div>
  <div class="sc-hero">
    <div class="sc-hero-img" id="scHeroImg"></div>
    <div class="sc-hero-fade"></div>
  </div>
  <div class="sc-body" id="scBody"></div>
</div>

<!-- ADVENTURE VIEW -->
<div id="adventureView">
  <div class="adv-topbar">
    <button class="adv-close" onclick="closeAdventure()">&#10005;</button>
    <div class="adv-party-hp" id="advPartyHp"></div>
    <button class="adv-sheet-btn" onclick="openSheetFromAdventure()">SHEET</button>
  </div>

  <div class="adv-mat" id="advMat">
    <div class="adv-mat-inner" id="advMatInner"></div>

    <div class="adv-narration-panel" id="advNarrationPanel">
      <button class="adv-narration-toggle" id="advNarrationToggle" onclick="toggleNarration()">&#9660; LOG</button>
      <div id="advNarrationLog"></div>
    </div>

    <div class="adv-free-input-overlay" id="advFreeInputOverlay">
      <input
        class="adv-free-input"
        id="advFreeInput"
        type="text"
        placeholder="Describe your action..."
        autocomplete="off"
      />
    </div>
  </div>

  <div class="adv-action-bar" id="advActionBar"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
