<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Gang Fights a Balrog</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;500;700&family=Zilla+Slab:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Sans:ital,wght@1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/cards.css">
<link rel="stylesheet" href="styles/detail.css">
<link rel="stylesheet" href="styles/sheet.css">
<style>
.d-btn-chat{width:100%;padding:9px 11px;background:rgba(10,18,30,.5);border:1px solid rgba(40,70,110,.55);color:rgba(100,145,195,.8);font-family:'Noto Sans Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;text-align:left;}
.d-btn-chat:active{background:rgba(18,30,50,.65);border-color:rgba(60,100,155,.7);color:rgba(130,175,230,.9);}
.d-btn-sub--chat{color:rgba(100,145,195,.55);}
</style>
</head>
<body>
<!-- SELECT -->
<div class="screen" id="selectScreen">
  <div class="s-bg"></div>
  <div class="s-vignette"></div>

  <div class="s-title">
    <h1>The Gang Fights a Balrog</h1>
  </div>

  <!-- Fighting-game roster: whole cast visible at once, no scrolling. -->
  <div class="roster" id="roster" role="listbox" aria-label="Choose your character"></div>

  <!-- Live preview. Updates on tap; never navigates away. -->
  <div class="preview" id="preview">
    <div class="pv-empty" id="pvEmpty">Pick your guy</div>
    <div class="pv-body" id="pvBody" hidden>
      <div class="pv-top">
        <div class="pv-emblem" id="pvEmblem"></div>
        <div class="pv-id">
          <div class="pv-name" id="pvName"></div>
          <div class="pv-cls" id="pvCls"></div>
        </div>
      </div>
      <div class="pv-role" id="pvRole"></div>
      <div class="pv-stats" id="pvStats"></div>
      <div class="pv-claim" id="pvClaim"></div>
      <div class="pv-actions">
        <button class="pv-btn pv-btn--sheet" id="pvGo" type="button">FULL SHEET</button>
      </div>
    </div>
  </div>
</div>

<!-- SHEET VIEW -->
<div id="sheetView">
  <div class="sh-topbar">
    <button class="sh-close" onclick="closeSheet()">&#10005;</button>
    <button class="sh-turn" onclick="openCombat(window.activeId)">MY TURN</button>
    <button class="sh-print" onclick="window.print()">PRINT</button>
    </div>
  <div class="sh-hero" id="shHero">
    <div class="sh-hero-img" id="shHeroImg"></div>
    <div class="sh-hero-fade"></div>
    <div class="sh-hero-info">
      <div class="sh-char-name" id="shCharName"></div>
      <div class="sh-class-line" id="shClassLine"></div>
    </div>
  </div>
  <div class="sh-body" id="shBody"></div>
</div>


<script type="module" src="app.js"></script>
<!-- COMBAT -->
<div id="combatView">
  <div class="cb-top">
    <button class="cb-close" id="cbClose" type="button">&#10005;</button>
    <div class="cb-who"><span id="cbName"></span></div>
  </div>

  <div class="cb-hp">
    <div class="cb-hp-row">
      <button class="cb-hp-btn" id="cbHurt" type="button">&minus;</button>
      <div class="cb-hp-mid">
        <div class="cb-hp-n" id="cbHp"></div>
        <div class="cb-hp-track"><div class="cb-hp-fill" id="cbHpBar"></div></div>
        <div class="cb-hp-l">HEALTH</div>
      </div>
      <button class="cb-hp-btn" id="cbHeal" type="button">+</button>
    </div>
  </div>

  <div class="cb-slots" id="cbSlots"></div>
  <div class="cb-log" id="cbLog">Tap something to do it. The app rolls the dice and does the sums.</div>
  <div class="cb-acts" id="cbActs"></div>
  <button class="cb-end" id="cbEnd" type="button">END TURN</button>
</div>

</body>
</html>
