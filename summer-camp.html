<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Summer Camp — Horrid Wake</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Josefin+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-dim: #7a6230;
    --bg: #0d0c0b;
    --bg2: #141210;
    --surface: #1a1714;
    --border: rgba(201,168,76,0.25);
    --text: #d4c9b0;
    --text-dim: #7a7060;
    --red: #c0392b;
    --green: #27ae60;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'IM Fell English', serif; }

  .sc-page { display: flex; flex-direction: column; height: 100dvh; }

  /* ── Topbar ── */
  .sc-topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sc-back-btn {
    background: none; border: 1px solid var(--gold-dim); color: var(--gold);
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em;
    padding: 5px 10px; cursor: pointer; border-radius: 2px;
  }
  .sc-back-btn:hover { border-color: var(--gold); }
  .sc-topbar-title { flex: 1; display: flex; align-items: baseline; gap: 10px; }
  .sc-char-name {
    font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700;
    color: var(--gold); letter-spacing: 0.05em;
  }
  .sc-lvl-badge {
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.12em;
    color: var(--text-dim); border: 1px solid var(--gold-dim);
    padding: 1px 6px; border-radius: 2px;
  }
  .sc-module-tag {
    font-family: 'Josefin Sans', sans-serif; font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-dim); text-transform: uppercase; margin-left: auto;
  }

  /* ── Initiative tracker strip ── */
  .combat-tracker {
    background: #100f0e;
    border-bottom: 1px solid rgba(201,168,76,0.4);
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .combat-tracker-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .combat-round-label {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.18em; color: var(--gold); text-transform: uppercase;
  }
  .combat-order {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  }
  .combat-order::-webkit-scrollbar { display: none; }
  .combatant-chip {
    flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 4px 8px; min-width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: border-color 0.15s;
  }
  .combatant-chip.current-turn {
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
  }
  .combatant-chip.dead { opacity: 0.35; }
  .combatant-chip-name {
    font-family: 'Cinzel', serif; font-size: 9px; font-weight: 600;
    letter-spacing: 0.06em; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 72px;
  }
  .combatant-chip.current-turn .combatant-chip-name { color: var(--gold); }
  .combatant-chip.dead .combatant-chip-name { text-decoration: line-through; }
  .hp-bar-track {
    width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px;
  }
  .hp-bar-fill {
    height: 100%; border-radius: 2px; transition: width 0.3s;
    background: var(--green);
  }
  .hp-bar-fill.low  { background: var(--gold); }
  .hp-bar-fill.crit { background: var(--red); }

  /* ── Chat log ── */
  .sc-log {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sc-log::-webkit-scrollbar { width: 4px; }
  .sc-log::-webkit-scrollbar-track { background: transparent; }
  .sc-log::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  /* ── Message blocks ── */
  .chat-msg {
    display: flex; flex-direction: column;
    max-width: 82%; word-break: break-word;
    margin: 2px 0;
  }
  .chat-msg.dm-msg  { align-self: flex-start; }
  .chat-msg.p-self  { align-self: flex-end; }
  .chat-msg.p-other { align-self: flex-start; }
  .chat-msg.combat-msg { align-self: center; max-width: 95%; }

  .msg-sender {
    font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; margin-bottom: 3px;
  }
  .p-self .msg-sender { text-align: right; }

  .msg-bubble {
    font-family: 'IM Fell English', serif; font-size: 15px; line-height: 1.6;
    padding: 8px 12px;
  }
  .dm-msg .msg-bubble {
    border-left: 3px solid var(--gold);
    background: rgba(201,168,76,0.07);
    color: var(--text);
    border-radius: 0 4px 4px 0;
  }
  .p-other .msg-bubble {
    border-left: 3px solid;
    background: rgba(255,255,255,0.03);
    color: var(--text); font-style: italic;
    border-radius: 0 4px 4px 0;
  }
  .p-self .msg-bubble {
    border-right: 3px solid;
    background: rgba(255,255,255,0.05);
    color: var(--text); font-style: italic;
    text-align: right;
    border-radius: 4px 0 0 4px;
  }
  .combat-msg .msg-bubble {
    border: none; border-radius: 3px; text-align: center;
    font-family: 'Josefin Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.08em; font-style: normal;
    padding: 5px 14px;
  }
  .combat-msg.hit   .msg-bubble { background: rgba(192,57,43,0.18); color: #e07060; }
  .combat-msg.miss  .msg-bubble { background: rgba(255,255,255,0.05); color: var(--text-dim); }
  .combat-msg.crit  .msg-bubble { background: rgba(201,168,76,0.2); color: var(--gold); }
  .combat-msg.heal  .msg-bubble { background: rgba(39,174,96,0.15); color: #60c080; }

  .msg-system {
    align-self: center; text-align: center;
    color: rgba(180,130,40,0.5);
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 0;
  }

  /* ── Typing indicator ── */
  .sc-typing {
    padding: 4px 26px 8px;
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.08em; font-style: italic;
    background: var(--bg); flex-shrink: 0;
  }

  /* ── Input bar (exploration) ── */
  .sc-input-row {
    display: flex; gap: 8px; padding: 12px 14px;
    background: var(--bg2); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sc-input {
    flex: 1;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'IM Fell English', serif; font-size: 15px;
    padding: 10px 12px; border-radius: 2px; outline: none;
  }
  .sc-input:focus { border-color: var(--gold); }
  .sc-input::placeholder { color: var(--text-dim); }
  .sc-send-btn {
    background: none; border: 1px solid var(--gold);
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 0.12em; padding: 0 18px; cursor: pointer; border-radius: 2px;
    flex-shrink: 0;
  }
  .sc-send-btn:hover { background: rgba(201,168,76,0.08); }
  .sc-send-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Combat action bar ── */
  .combat-input-row {
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 10px 14px; flex-shrink: 0;
    overflow-y: auto; max-height: 220px;
  }
  .combat-waiting-label {
    font-family: 'Josefin Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.12em; color: var(--text-dim);
    text-align: center; padding: 10px 0; text-transform: uppercase;
  }
  .action-sections { display: flex; flex-direction: column; gap: 8px; }
  .action-section { display: flex; flex-direction: column; gap: 4px; }
  .action-section-label {
    font-family: 'Josefin Sans', sans-serif; font-size: 9px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
  }
  .action-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .action-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.07em; padding: 7px 10px; cursor: pointer;
    border-radius: 2px; text-align: center; transition: border-color 0.1s, background 0.1s;
    flex: 1; min-width: 80px;
  }
  .action-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(201,168,76,0.06); }
  .action-btn:disabled { opacity: 0.35; cursor: default; }
  .action-btn.special { border-color: var(--gold-dim); color: var(--gold); }
  .action-btn.active  { border-color: var(--red); color: #e07060; background: rgba(192,57,43,0.1); }
  .action-bonus {
    display: block; font-family: 'Josefin Sans', sans-serif;
    font-size: 9px; color: var(--text-dim); margin-top: 1px; letter-spacing: 0.06em;
  }

  /* ── d20 roll overlay ── */
  .roll-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .d20-frame {
    background: var(--bg2); border: 2px solid var(--gold);
    border-radius: 4px; padding: 28px 48px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .d20-label {
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
  }
  .d20-number {
    font-family: 'Cinzel Decorative', serif; font-size: 56px; font-weight: 900;
    color: var(--gold); line-height: 1; min-width: 80px; text-align: center;
  }
  .d20-number.crit { color: #ffe066; }
  .d20-number.fumble { color: var(--red); }
  .d20-result-line {
    font-family: 'Josefin Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="sc-page">
  <div class="sc-topbar">
    <button class="sc-back-btn" onclick="history.back()">&#8592; BACK</button>
    <div class="sc-topbar-title">
      <span class="sc-char-name" id="scCharName"></span>
      <span class="sc-lvl-badge">LVL 1</span>
    </div>
    <span class="sc-module-tag">Lost Mines of Phandelver</span>
  </div>

  <!-- Initiative tracker (combat only) -->
  <div class="combat-tracker" id="combatTracker" style="display:none">
    <div class="combat-tracker-header">
      <span class="combat-round-label" id="combatRoundLabel">Round 1</span>
    </div>
    <div class="combat-order" id="combatOrder"></div>
  </div>

  <div class="sc-log" id="scLog"></div>
  <div class="sc-typing" id="scTyping" style="display:none">The DM is writing…</div>

  <!-- Exploration input -->
  <div class="sc-input-row" id="explorationInput">
    <input class="sc-input" id="scInput" type="text" placeholder="Say something…" autocomplete="off" />
    <button class="sc-send-btn" id="scSendBtn" onclick="sendMessage()">SEND</button>
  </div>

  <!-- Combat action bar -->
  <div class="combat-input-row" id="combatInput" style="display:none">
    <div class="combat-waiting-label" id="combatWaiting" style="display:none"></div>
    <div class="action-sections" id="actionSections" style="display:none"></div>
  </div>
</div>

<!-- d20 roll overlay -->
<div class="roll-overlay" id="rollOverlay" style="display:none">
  <div class="d20-frame">
    <div class="d20-label">Rolling…</div>
    <div class="d20-number" id="d20Number">?</div>
    <div class="d20-result-line" id="d20ResultLine"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script type="module">
  import { CHARS } from './services/characters.js';
  import { SHEETS } from './services/characters.js';
  import { initFirebase } from './services/firebase.js';
  import * as Combat from './services/combat.js';
  import { rollAttack, rollDamage, checkHit } from './services/dice.js';

  // ── Character data ───────────────────────────────────────────────
  const CHAR_COLORS = {
    dennis: '#9b59b6', mac: '#e67e22', charlie: '#27ae60',
    dee: '#e91e8c', frank: '#c0392b', dm: '#c9a84c',
  };

  const ATTACK_BONUS = { dennis: 5, mac: 5, charlie: 6, dee: 4, frank: 5 };

  const DAMAGE_DICE = {
    dennis: { dice: '1d6', mod: 3 },
    mac:    { dice: '1d8', mod: 3 },
    charlie:{ dice: '1d6', mod: 4 },
    dee:    { dice: '1d8', mod: 2 },
    frank:  { dice: '1d12', mod: 3 },
  };

  // STR mod for shove (d20 + STR mod vs target STR)
  const STR_MOD = { dennis: -1, mac: 3, charlie: 0, dee: -1, frank: 3 };

  // Spells by character (level 1 sheets)
  const SPELLS = {
    dennis: [
      { name: 'Ray of Frost',  type: 'cantrip' },
      { name: 'Magic Missile', type: '1st lvl' },
      { name: 'Mage Hand',     type: 'cantrip' },
      { name: 'Shield',        type: '1st lvl' },
    ],
    charlie: [
      { name: 'Thorn Spray',  type: 'cantrip' },
      { name: 'Entangle',     type: '1st lvl' },
      { name: 'Cure Wounds',  type: '1st lvl', heals: true, healDice: '1d8', healMod: 4 },
    ],
    dee: [
      { name: 'Vicious Mockery', type: 'cantrip' },
      { name: 'Charm Person',    type: '1st lvl' },
      { name: 'Cure Wounds',     type: '1st lvl', heals: true, healDice: '1d8', healMod: 2 },
    ],
  };

  const params = new URLSearchParams(location.search);
  const charId = params.get('character');
  const char   = CHARS.find(c => c.id === charId) || CHARS[0];

  document.getElementById('scCharName').textContent = char.name;
  document.title = char.name + ' — Summer Camp';

  // ── DOM refs ─────────────────────────────────────────────────────
  const log             = document.getElementById('scLog');
  const typingEl        = document.getElementById('scTyping');
  const input           = document.getElementById('scInput');
  const sendBtn         = document.getElementById('scSendBtn');
  const explorationEl   = document.getElementById('explorationInput');
  const combatInputEl   = document.getElementById('combatInput');
  const combatTrackerEl = document.getElementById('combatTracker');
  const combatOrderEl   = document.getElementById('combatOrder');
  const combatRoundEl   = document.getElementById('combatRoundLabel');
  const actionSectionsEl= document.getElementById('actionSections');
  const combatWaitEl    = document.getElementById('combatWaiting');
  const rollOverlay     = document.getElementById('rollOverlay');
  const d20NumberEl     = document.getElementById('d20Number');
  const d20ResultEl     = document.getElementById('d20ResultLine');

  // Firebase refs — assigned after initFirebase()
  let chatRef, stateRef, combatRef;

  // Per-turn state
  let frankReckless = false;
  let bonusActionUsed = false;

  // ── Message rendering ─────────────────────────────────────────────
  function renderMsg(msg) {
    if (msg.type === 'system') {
      const el = document.createElement('div');
      el.className = 'msg-system';
      el.innerHTML = '<em>' + msg.text + '</em>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return;
    }
    if (msg.type === 'dm') {
      const wrap = document.createElement('div');
      wrap.className = 'chat-msg dm-msg';
      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = 'DM';
      sender.style.color = CHAR_COLORS.dm;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = msg.text;
      wrap.appendChild(sender);
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return;
    }
    if (msg.type === 'combat') {
      const wrap = document.createElement('div');
      wrap.className = 'chat-msg combat-msg ' + (msg.subtype || '');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = msg.text;
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return;
    }
    // Player message
    const isSelf = msg.characterId === char.id;
    const color  = CHAR_COLORS[msg.characterId] || '#c9a84c';
    const wrap   = document.createElement('div');
    wrap.className = 'chat-msg ' + (isSelf ? 'p-self' : 'p-other');
    const sender = document.createElement('div');
    sender.className = 'msg-sender';
    sender.textContent = msg.characterName;
    sender.style.color = color;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;
    bubble.style.borderColor = color;
    wrap.appendChild(sender);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  // ── Initiative tracker ────────────────────────────────────────────
  function renderTracker(state) {
    if (!state?.active) { combatTrackerEl.style.display = 'none'; return; }
    combatTrackerEl.style.display = '';
    combatRoundEl.textContent = 'Round ' + state.round;
    combatOrderEl.innerHTML = '';
    state.initiativeOrder.forEach((c, i) => {
      const pct  = c.maxHp > 0 ? c.hp / c.maxHp : 0;
      const dead = c.hp <= 0;
      const chip = document.createElement('div');
      chip.className = 'combatant-chip'
        + (i === state.currentTurnIndex && !dead ? ' current-turn' : '')
        + (dead ? ' dead' : '');
      const nameEl = document.createElement('div');
      nameEl.className = 'combatant-chip-name';
      nameEl.textContent = c.name.split(' ')[0];
      const track = document.createElement('div');
      track.className = 'hp-bar-track';
      const fill = document.createElement('div');
      fill.className = 'hp-bar-fill' + (pct <= 0.25 ? ' crit' : pct <= 0.5 ? ' low' : '');
      fill.style.width = Math.round(pct * 100) + '%';
      track.appendChild(fill);
      chip.appendChild(nameEl);
      chip.appendChild(track);
      combatOrderEl.appendChild(chip);
    });
  }

  // ── Combat action bar ─────────────────────────────────────────────
  function renderActionBar(state) {
    if (!state?.active) {
      combatInputEl.style.display = 'none';
      explorationEl.style.display = '';
      return;
    }
    explorationEl.style.display = 'none';
    combatInputEl.style.display = '';

    const currentTurn = state.initiativeOrder[state.currentTurnIndex];
    const myTurn = currentTurn && currentTurn.id === char.id && currentTurn.hp > 0;

    if (!myTurn) {
      combatWaitEl.style.display    = '';
      actionSectionsEl.style.display = 'none';
      const whose = currentTurn ? currentTurn.name.split(' ')[0] : '…';
      combatWaitEl.textContent = 'Waiting for ' + whose + '…';

      if (currentTurn?.type === 'enemy' && currentTurn.hp > 0) {
        const livingPlayers = state.initiativeOrder.filter(c => c.type === 'player' && c.hp > 0);
        if (livingPlayers.length && livingPlayers[0].id === char.id) {
          triggerEnemyTurn(currentTurn.id);
        }
      }
      return;
    }

    combatWaitEl.style.display    = 'none';
    actionSectionsEl.style.display = '';
    buildActionButtons(state);
  }

  // ── Action menu builder ───────────────────────────────────────────
  function buildActionButtons(state) {
    frankReckless    = false;
    bonusActionUsed  = false;
    const livingEnemies = state.initiativeOrder.filter(c => c.type === 'enemy' && c.hp > 0);
    actionSectionsEl.innerHTML = '';

    // ── ACTION section ──
    const actionRow = makeSection(actionSectionsEl, 'Action');
    addBtn(actionRow, 'Attack', '+' + ATTACK_BONUS[char.id],
      () => handleAttack(livingEnemies), !livingEnemies.length);
    if (SPELLS[char.id]) {
      addBtn(actionRow, 'Cast Spell', 'choose spell', () => showSpellMenu(state));
    }
    addBtn(actionRow, 'Shove', 'STR check', () => handleShove(livingEnemies), !livingEnemies.length);

    // ── BONUS ACTION section ──
    const bonusRow = makeSection(actionSectionsEl, 'Bonus Action');
    const bonusActions = {
      dennis:  { label: 'Wild Magic',      bonus: 'chaos',       handler: handleWildMagic },
      mac:     { label: 'Divine Smite',    bonus: '+2d8 rad.',   handler: () => handleSmite(livingEnemies) },
      charlie: { label: 'Symbiotic Entity',bonus: 'spore boost', handler: handleSymbioticEntity },
      dee:     { label: 'Bardic Inspire',  bonus: 'd8 to ally',  handler: handleBardicInspiration },
      frank:   { label: 'Reckless Atk',   bonus: 'adv. toggle', handler: null, isToggle: true },
    };
    const ba = bonusActions[char.id];
    if (ba) {
      if (ba.isToggle) {
        const btn = makeBtn(ba.label, ba.bonus, null, false, 'special');
        btn.addEventListener('click', () => handleRecklessToggle(btn));
        bonusRow.appendChild(btn);
      } else {
        addBtn(bonusRow, ba.label, ba.bonus, ba.handler, false, 'special');
      }
    } else {
      const none = makeBtn('—', 'none');
      none.disabled = true;
      bonusRow.appendChild(none);
    }

    // ── OTHER section ──
    const otherRow = makeSection(actionSectionsEl, 'Other');
    addBtn(otherRow, 'Help',     'ally adv.',      () => handleSimpleAction('moves to assist, setting up an ally\'s next strike.'));
    addBtn(otherRow, 'Dodge',    'until next turn', () => handleSimpleAction('dodges, bracing for the next hit.'));
    addBtn(otherRow, 'Use Item', 'misc.',           () => handleSimpleAction('uses an item.'));
  }

  function makeSection(parent, label) {
    const sec = document.createElement('div');
    sec.className = 'action-section';
    const lbl = document.createElement('div');
    lbl.className = 'action-section-label';
    lbl.textContent = label;
    const row = document.createElement('div');
    row.className = 'action-row';
    sec.appendChild(lbl);
    sec.appendChild(row);
    parent.appendChild(sec);
    return row;
  }

  function makeBtn(label, bonus, handler, disabled = false, extraClass = '') {
    const btn = document.createElement('button');
    btn.className = 'action-btn' + (extraClass ? ' ' + extraClass : '');
    btn.disabled = disabled;
    btn.innerHTML = label + '<span class="action-bonus">' + bonus + '</span>';
    if (handler) btn.addEventListener('click', handler);
    return btn;
  }

  function addBtn(row, label, bonus, handler, disabled = false, extraClass = '') {
    row.appendChild(makeBtn(label, bonus, handler, disabled, extraClass));
  }

  function disableActions() {
    actionSectionsEl.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  // ── Spell sub-menu ────────────────────────────────────────────────
  function showSpellMenu(state) {
    actionSectionsEl.innerHTML = '';
    const row = makeSection(actionSectionsEl, 'Choose a spell — or');
    const backBtn = makeBtn('← Back', 'cancel', () => buildActionButtons(state));
    row.appendChild(backBtn);
    (SPELLS[char.id] || []).forEach(spell => {
      addBtn(row, spell.name, spell.type, () => handleCastSpell(spell));
    });
  }

  async function handleCastSpell(spell) {
    disableActions();
    let text = `${char.name} casts ${spell.name}.`;
    let subtype = 'hit';
    if (spell.heals) {
      const { total } = rollDamage(spell.healDice, spell.healMod);
      await Combat.applyHealing(char.id, total);
      text = `${char.name} casts ${spell.name} — heals for ${total} HP.`;
      subtype = 'heal';
    }
    await chatRef.push({ type: 'combat', subtype, characterId: char.id, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  // ── d20 animation ─────────────────────────────────────────────────
  function animateRoll(finalRoll) {
    return new Promise(resolve => {
      rollOverlay.style.display = 'flex';
      d20NumberEl.className = 'd20-number';
      d20ResultEl.textContent = '';
      let ticks = 0;
      const iv = setInterval(() => {
        d20NumberEl.textContent = Math.floor(Math.random() * 20) + 1;
        if (++ticks >= 12) {
          clearInterval(iv);
          d20NumberEl.textContent = finalRoll;
          if (finalRoll === 20)    { d20NumberEl.className = 'd20-number crit';   d20ResultEl.textContent = 'CRITICAL HIT'; }
          else if (finalRoll === 1){ d20NumberEl.className = 'd20-number fumble'; d20ResultEl.textContent = 'FUMBLE'; }
          setTimeout(() => { rollOverlay.style.display = 'none'; resolve(); }, 700);
        }
      }, 40);
    });
  }

  // ── Attack ────────────────────────────────────────────────────────
  async function handleAttack(livingEnemies, extraDamageDice) {
    if (!livingEnemies.length) return;
    disableActions();
    const target = livingEnemies[0];
    let attackResult;
    if (frankReckless) {
      const r1 = rollAttack(ATTACK_BONUS[char.id]);
      const r2 = rollAttack(ATTACK_BONUS[char.id]);
      attackResult = r1.total >= r2.total ? r1 : r2;
    } else {
      attackResult = rollAttack(ATTACK_BONUS[char.id]);
    }
    await animateRoll(attackResult.roll);

    const hit    = checkHit(attackResult.total, target.ac);
    const dmgCfg = DAMAGE_DICE[char.id];
    let damage = 0, subtype = 'miss', combatText;

    if (hit) {
      const extra  = extraDamageDice ? rollDamage(extraDamageDice, 0).total : 0;
      damage = rollDamage(dmgCfg.dice, dmgCfg.mod).total + extra;
      subtype = attackResult.isCrit ? 'crit' : 'hit';
      await Combat.applyDamage(target.id, damage);
      combatText = `${char.name} attacks ${target.name} — roll ${attackResult.total} vs AC ${target.ac}. Hit! ${damage} damage${extraDamageDice ? ' (includes smite)' : ''}${frankReckless ? ' (reckless)' : ''}.`;
    } else {
      combatText = `${char.name} attacks ${target.name} — roll ${attackResult.total} vs AC ${target.ac}. Miss${frankReckless ? ' (reckless)' : ''}.`;
    }

    await chatRef.push({ type: 'combat', subtype, characterId: char.id, text: combatText, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(combatText);
  }

  async function handleSmite(livingEnemies) {
    await handleAttack(livingEnemies, '2d8');
  }

  // ── Shove ─────────────────────────────────────────────────────────
  async function handleShove(livingEnemies) {
    if (!livingEnemies.length) return;
    disableActions();
    const target = livingEnemies[0];
    const myRoll = rollAttack(STR_MOD[char.id] || 0);
    await animateRoll(myRoll.roll);
    const targetStr = 10; // simplified — no target STR stat stored
    const targetRoll = Math.floor(Math.random() * 20) + 1 + Math.floor((targetStr - 10) / 2);
    const success = myRoll.total >= targetRoll;
    const text = success
      ? `${char.name} shoves ${target.name} — roll ${myRoll.total} vs ${targetRoll}. Knocked prone!`
      : `${char.name} tries to shove ${target.name} — roll ${myRoll.total} vs ${targetRoll}. No effect.`;
    await chatRef.push({ type: 'combat', subtype: success ? 'hit' : 'miss', characterId: char.id, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  // ── Simple action ─────────────────────────────────────────────────
  async function handleSimpleAction(flavorText) {
    disableActions();
    const text = `${char.name} ${flavorText}`;
    await chatRef.push({ type: 'player', characterId: char.id, characterName: char.name, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  // ── Bonus actions ─────────────────────────────────────────────────
  function handleRecklessToggle(btn) {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    frankReckless = true;
    // Mark the button active, leave attack buttons enabled
    btn.classList.add('active');
    btn.innerHTML = 'Reckless ON<span class="action-bonus">adv. active</span>';
    btn.disabled = true;
    chatRef.push({ type: 'combat', subtype: 'hit', characterId: char.id,
      text: `${char.name} commits to reckless attacks — advantage on attacks, enemies have advantage back.`,
      timestamp: Date.now() });
  }

  async function handleWildMagic() {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    disableActions();
    const r = Math.floor(Math.random() * 20) + 1;
    const effects = [
      'a random fireball erupts centered on Dennis',
      'Dennis turns invisible until he attacks',
      'Dennis and the nearest creature swap positions',
      'flower petals rain from the sky — no game effect',
      'Dennis grows 1 foot taller',
      'a third eye opens on Dennis\'s forehead',
      'all doors within 60ft slam shut simultaneously',
      'Dennis\'s hair turns bright blue',
      'a spectral hand slaps the nearest enemy',
      'everyone in 30ft is deafened for 1 minute',
    ];
    const text = `WILD MAGIC SURGE (d20: ${r}): ${effects[r % effects.length]}.`;
    await chatRef.push({ type: 'combat', subtype: 'crit', characterId: char.id, text, timestamp: Date.now() });
    await callDM(text);
  }

  async function handleSymbioticEntity() {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    disableActions();
    const text = `${char.name} activates Symbiotic Entity — spores coat their body, dealing 4d6 necrotic on hit until short rest.`;
    await chatRef.push({ type: 'combat', subtype: 'hit', characterId: char.id, text, timestamp: Date.now() });
    await callDM(text);
  }

  async function handleBardicInspiration() {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    disableActions();
    const allies = ['Mac', 'Dennis', 'Charlie', 'Dee', 'Frank'].filter(n => n.toLowerCase() !== char.id);
    const target = allies[Math.floor(Math.random() * allies.length)];
    const text = `${char.name} grants Bardic Inspiration to ${target} — add a d8 to your next roll.`;
    await chatRef.push({ type: 'combat', subtype: 'heal', characterId: char.id, text, timestamp: Date.now() });
    await callDM(text);
  }

  // ── Enemy turn ────────────────────────────────────────────────────
  let enemyTurnInProgress = false;
  async function triggerEnemyTurn(enemyId) {
    if (enemyTurnInProgress) return;
    enemyTurnInProgress = true;
    try {
      const result = await Combat.getEnemyAction(enemyId);
      if (!result?.attacks?.length) return;

      const lines = [];
      for (const atk of result.attacks) {
        const subtype = atk.hit ? (atk.isCrit ? 'crit' : 'hit') : 'miss';
        const text = atk.hit
          ? `${result.attacker} attacks ${atk.target} — roll ${atk.total}. Hit! ${atk.damage} damage.`
          : `${result.attacker} attacks ${atk.target} — roll ${atk.total}. Miss.`;
        await chatRef.push({ type: 'combat', subtype, characterId: 'dm', text, timestamp: Date.now() });
        lines.push(text);
      }
      await callDM(lines.join(' '));
    } finally {
      enemyTurnInProgress = false;
    }
  }

  // ── DM call ───────────────────────────────────────────────────────
  async function callDM(combatContext) {
    const stateSnap = await stateRef.once('value');
    if (stateSnap.val()?.thinking) return;

    const combatSnap   = await combatRef.once('value');
    const combatActive = combatSnap.val()?.active || false;

    await stateRef.set({ thinking: true });
    try {
      const snap = await chatRef.once('value');
      const msgs = snap.val();
      const history = msgs ? Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp).map(m => ({
        role:    m.type === 'dm' ? 'assistant' : 'user',
        content: m.type === 'player' ? m.characterName + ': ' + m.text : m.text,
      })) : [];

      const res = await fetch('/api/dm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, combatContext: combatContext || null, combatActive }),
      });
      if (!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();

      const narration = data.narration || 'The dungeon falls silent.';
      await chatRef.push({ type: 'dm', characterId: 'dm', characterName: 'DM', text: narration, timestamp: Date.now() });

      if (data.combatTrigger && !combatActive && data.combatTrigger.enemies?.length) {
        await Combat.startCombat(data.combatTrigger.enemies);
        await chatRef.push({ type: 'system', text: '⚔️ Roll for initiative.', timestamp: Date.now() });
      }

      if (data.combatEnd && combatActive) {
        await Combat.endCombat();
        await chatRef.push({ type: 'system', text: '✓ Combat ended.', timestamp: Date.now() });
      }
    } catch (err) {
      console.error('[summer-camp] DM error:', err);
    } finally {
      await stateRef.set({ thinking: false });
    }
  }

  // ── Exploration send ──────────────────────────────────────────────
  function setBusy(busy) {
    sendBtn.disabled = busy;
    input.disabled   = busy;
  }

  // ── Firebase init ─────────────────────────────────────────────────
  initFirebase();
  const db = window.firebaseDb;

  if (!db) {
    renderMsg({ type: 'system', text: '⚠ Connection unavailable. Reload to try again.' });
    sendBtn.disabled = true;
    input.disabled   = true;
    input.placeholder = 'Connection unavailable';
  } else {
    chatRef   = db.ref('/sessions/lostmines/chat');
    stateRef  = db.ref('/sessions/lostmines/state');
    combatRef = db.ref('/sessions/lostmines/combat');

    chatRef.on('value', snapshot => {
      log.innerHTML = '';
      const msgs = snapshot.val();
      if (!msgs) { renderMsg({ type: 'system', text: 'Entering the dungeon…' }); return; }
      Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp).forEach(renderMsg);
    });

    stateRef.on('value', snapshot => {
      typingEl.style.display = snapshot.val()?.thinking ? '' : 'none';
    });

    combatRef.on('value', snapshot => {
      const state = snapshot.val();
      renderTracker(state);
      renderActionBar(state);
    });

    // ── Exploration mode send ───────────────────────────────────────
    async function triggerDM() { await callDM(null); }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = '';
      setBusy(true);
      await chatRef.push({ type: 'player', characterId: char.id, characterName: char.name, text, timestamp: Date.now() });
      await triggerDM();
      setBusy(false);
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    window.sendMessage = sendMessage;

    // ── Session init ────────────────────────────────────────────────
    async function init() {
      db.ref('/sessions/lostmines/presence').child(char.id).set({
        characterName: char.name, joined: Date.now(),
      });

      // Late-join: if combat is active and we're not in the order, add us
      const combatSnap = await combatRef.once('value');
      const combatState = combatSnap.val();
      if (combatState?.active) {
        const inOrder = combatState.initiativeOrder?.some(c => c.id === char.id);
        if (!inOrder) await Combat.addPlayerToCombat(char.id);
      }

      const snap = await chatRef.once('value');
      if (snap.val()) { input.focus(); return; }

      const stateSnap = await stateRef.once('value');
      if (stateSnap.val()?.thinking) { input.focus(); return; }

      setBusy(true);
      await stateRef.set({ thinking: true });
      try {
        const openingPrompt = 'The adventure begins. Set the opening scene on the Triboar Trail — the ambush. Dead horses, goblin arrows. Be brief and punchy. Talk to the whole group.';
        const res = await fetch('/api/dm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'user', content: openingPrompt }], combatActive: false }),
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();
        const text = data.narration || 'The Triboar Trail stretches into shadow.';
        await chatRef.push({ type: 'dm', characterId: 'dm', characterName: 'DM', text, timestamp: Date.now() });
      } catch (err) {
        await chatRef.push({ type: 'dm', characterId: 'dm', characterName: 'DM', text: 'The Triboar Trail stretches into shadow. Something moves in the trees.', timestamp: Date.now() });
        console.error('[summer-camp] opening scene:', err);
      } finally {
        await stateRef.set({ thinking: false });
      }
      setBusy(false);
      input.focus();
    }

    init();
  }
</script>
</body>
</html>
