<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Summer Camp — Horrid Wake</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Josefin+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-dim: #7a6230;
    --bg: #0d0c0b;
    --bg2: #141210;
    --surface: #1a1714;
    --border: rgba(201,168,76,0.25);
    --text: #d4c9b0;
    --text-dim: #7a7060;
    --red: #c0392b;
    --green: #27ae60;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'IM Fell English', serif; }

  .sc-page { display: flex; flex-direction: column; height: 100dvh; }

  /* ── Topbar ── */
  .sc-topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sc-back-btn {
    background: none; border: 1px solid var(--gold-dim); color: var(--gold);
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em;
    padding: 5px 10px; cursor: pointer; border-radius: 2px;
  }
  .sc-back-btn:hover { border-color: var(--gold); }
  .sc-topbar-title { flex: 1; display: flex; align-items: baseline; gap: 10px; }
  .sc-char-name {
    font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700;
    color: var(--gold); letter-spacing: 0.05em;
  }
  .sc-lvl-badge {
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.12em;
    color: var(--text-dim); border: 1px solid var(--gold-dim);
    padding: 1px 6px; border-radius: 2px;
  }
  .sc-module-tag {
    font-family: 'Josefin Sans', sans-serif; font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-dim); text-transform: uppercase; margin-left: auto;
  }

  /* ── Initiative tracker strip ── */
  .combat-tracker {
    background: #100f0e;
    border-bottom: 1px solid rgba(201,168,76,0.4);
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .combat-tracker-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .combat-round-label {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.18em; color: var(--gold); text-transform: uppercase;
  }
  .combat-order {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  }
  .combat-order::-webkit-scrollbar { display: none; }
  .combatant-chip {
    flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 4px 8px; min-width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: border-color 0.15s;
  }
  .combatant-chip.current-turn {
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
  }
  .combatant-chip.dead { opacity: 0.35; }
  .combatant-chip-name {
    font-family: 'Cinzel', serif; font-size: 9px; font-weight: 600;
    letter-spacing: 0.06em; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 72px;
  }
  .combatant-chip.current-turn .combatant-chip-name { color: var(--gold); }
  .combatant-chip.dead .combatant-chip-name { text-decoration: line-through; }
  .hp-bar-track {
    width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px;
  }
  .hp-bar-fill {
    height: 100%; border-radius: 2px; transition: width 0.3s;
    background: var(--green);
  }
  .hp-bar-fill.low  { background: var(--gold); }
  .hp-bar-fill.crit { background: var(--red); }

  /* ── Chat log ── */
  .sc-log {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sc-log::-webkit-scrollbar { width: 4px; }
  .sc-log::-webkit-scrollbar-track { background: transparent; }
  .sc-log::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  /* ── Message blocks ── */
  .chat-msg {
    display: flex; flex-direction: column;
    max-width: 82%; word-break: break-word;
    margin: 2px 0;
  }
  .chat-msg.dm-msg  { align-self: flex-start; }
  .chat-msg.p-self  { align-self: flex-end; }
  .chat-msg.p-other { align-self: flex-start; }
  .chat-msg.combat-msg { align-self: center; max-width: 95%; }

  .msg-sender {
    font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; margin-bottom: 3px;
  }
  .p-self .msg-sender { text-align: right; }

  .msg-bubble {
    font-family: 'IM Fell English', serif; font-size: 15px; line-height: 1.6;
    padding: 8px 12px;
  }
  .dm-msg .msg-bubble {
    border-left: 3px solid var(--gold);
    background: rgba(201,168,76,0.07);
    color: var(--text);
    border-radius: 0 4px 4px 0;
  }
  .p-other .msg-bubble {
    border-left: 3px solid;
    background: rgba(255,255,255,0.03);
    color: var(--text); font-style: italic;
    border-radius: 0 4px 4px 0;
  }
  .p-self .msg-bubble {
    border-right: 3px solid;
    background: rgba(255,255,255,0.05);
    color: var(--text); font-style: italic;
    text-align: right;
    border-radius: 4px 0 0 4px;
  }
  .combat-msg .msg-bubble {
    border: none; border-radius: 3px; text-align: center;
    font-family: 'Josefin Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.08em; font-style: normal;
    padding: 5px 14px;
  }
  .combat-msg.hit   .msg-bubble { background: rgba(192,57,43,0.18); color: #e07060; }
  .combat-msg.miss  .msg-bubble { background: rgba(255,255,255,0.05); color: var(--text-dim); }
  .combat-msg.crit  .msg-bubble { background: rgba(201,168,76,0.2); color: var(--gold); }
  .combat-msg.heal  .msg-bubble { background: rgba(39,174,96,0.15); color: #60c080; }

  .msg-system {
    align-self: center; text-align: center;
    color: rgba(180,130,40,0.5);
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 0;
  }

  /* ── Typing indicator ── */
  .sc-typing {
    padding: 4px 26px 8px;
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.08em; font-style: italic;
    background: var(--bg); flex-shrink: 0;
  }

  /* ── Input bar (exploration) ── */
  .sc-input-row {
    display: flex; gap: 8px; padding: 12px 14px;
    background: var(--bg2); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sc-input {
    flex: 1;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'IM Fell English', serif; font-size: 15px;
    padding: 10px 12px; border-radius: 2px; outline: none;
  }
  .sc-input:focus { border-color: var(--gold); }
  .sc-input::placeholder { color: var(--text-dim); }
  .sc-send-btn {
    background: none; border: 1px solid var(--gold);
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 0.12em; padding: 0 18px; cursor: pointer; border-radius: 2px;
    flex-shrink: 0;
  }
  .sc-send-btn:hover { background: rgba(201,168,76,0.08); }
  .sc-send-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Combat action bar ── */
  .combat-input-row {
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 10px 14px; flex-shrink: 0;
    overflow-y: auto; max-height: 220px;
  }
  .combat-waiting-label {
    font-family: 'Josefin Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.12em; color: var(--text-dim);
    text-align: center; padding: 10px 0; text-transform: uppercase;
  }
  .action-sections { display: flex; flex-direction: column; gap: 8px; }
  .action-section { display: flex; flex-direction: column; gap: 4px; }
  .action-section-label {
    font-family: 'Josefin Sans', sans-serif; font-size: 9px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
  }
  .action-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .action-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.07em; padding: 7px 10px; cursor: pointer;
    border-radius: 2px; text-align: center; transition: border-color 0.1s, background 0.1s;
    flex: 1; min-width: 80px;
  }
  .action-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(201,168,76,0.06); }
  .action-btn:disabled { opacity: 0.35; cursor: default; }
  .action-btn.special { border-color: var(--gold-dim); color: var(--gold); }
  .action-btn.active  { border-color: var(--red); color: #e07060; background: rgba(192,57,43,0.1); }
  .action-bonus {
    display: block; font-family: 'Josefin Sans', sans-serif;
    font-size: 9px; color: var(--text-dim); margin-top: 1px; letter-spacing: 0.06em;
  }

  /* ── d20 roll overlay ── */
  .roll-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .d20-frame {
    background: var(--bg2); border: 2px solid var(--gold);
    border-radius: 4px; padding: 28px 48px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .d20-label {
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
  }
  .d20-number {
    font-family: 'Cinzel Decorative', serif; font-size: 56px; font-weight: 900;
    color: var(--gold); line-height: 1; min-width: 80px; text-align: center;
  }
  .d20-number.crit { color: #ffe066; }
  .d20-number.fumble { color: var(--red); }
  .d20-result-line {
    font-family: 'Josefin Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase;
  }

  /* ── DM structured message format ── */
  .dm-sentence { display: inline; }
  .dm-info-btn {
    display: inline; background: none; border: none;
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 11px;
    cursor: pointer; padding: 0 3px; vertical-align: baseline;
    opacity: 0.65; line-height: 1;
  }
  .dm-info-btn:hover { opacity: 1; }
  .dm-mechanic {
    display: block; margin: 4px 0 6px; padding: 5px 8px;
    background: rgba(201,168,76,0.06); border-left: 2px solid var(--gold-dim);
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    letter-spacing: 0.03em; color: var(--text-dim); line-height: 1.55;
    border-radius: 0 2px 2px 0;
  }
  .dm-events {
    margin-top: 5px; border-left: 3px solid var(--gold);
    padding: 5px 8px; background: rgba(201,168,76,0.04);
    display: flex; flex-direction: column; gap: 3px;
    border-radius: 0 3px 3px 0;
  }
  .dm-event {
    font-family: 'Josefin Sans', sans-serif; font-size: 11px;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .dm-event--hp_change  { color: #e07060; }
  .dm-event--spell_slot { color: rgba(140,110,220,0.9); }
  .dm-event--death_save { color: var(--red); }
  .dm-event--status     { color: rgba(90,170,110,0.9); }
  .dm-event--resource   { color: var(--gold); }

  /* ── Character sheet drawer ── */
  .cs-sheet-btn {
    background: none; border: 1px solid var(--gold-dim); color: var(--gold);
    padding: 5px 8px; cursor: pointer; border-radius: 2px; flex-shrink: 0;
    display: flex; align-items: center; transition: border-color 0.15s, background 0.15s;
  }
  .cs-sheet-btn:hover { border-color: var(--gold); background: rgba(201,168,76,0.07); }

  .cs-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0);
    z-index: 200; pointer-events: none; transition: background 0.3s;
  }
  .cs-overlay.open { background: rgba(0,0,0,0.65); pointer-events: auto; }

  .cs-drawer {
    position: fixed; top: 0; right: 0;
    width: min(400px, 100vw); height: 100dvh;
    background: var(--bg2); border-left: 1px solid var(--gold-dim);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    z-index: 201; display: flex; flex-direction: column;
  }
  .cs-drawer.open { transform: translateX(0); }

  .cs-close-btn {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 4px; z-index: 10;
  }
  .cs-close-btn:hover { color: var(--gold); }

  .cs-hdr {
    flex-shrink: 0; padding: 14px 40px 12px 16px;
    border-bottom: 1px solid var(--gold);
  }
  .cs-hdr-name {
    font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;
    color: var(--gold); letter-spacing: 0.04em; margin-bottom: 4px;
  }
  .cs-hdr-class {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--text); letter-spacing: 0.08em; margin-bottom: 3px;
  }
  .cs-hdr-meta {
    font-family: 'Josefin Sans', sans-serif; font-size: 10px;
    color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase;
  }

  .cs-panels-wrap {
    flex: 1; overflow: hidden; position: relative;
  }
  .cs-panels {
    display: flex; width: 400%; height: 100%;
    transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    will-change: transform;
  }
  .cs-panel {
    width: 25%; height: 100%; overflow-y: auto;
    padding: 14px 16px 24px;
  }
  .cs-panel::-webkit-scrollbar { width: 3px; }
  .cs-panel::-webkit-scrollbar-track { background: transparent; }
  .cs-panel::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  .cs-edge-prev, .cs-edge-next {
    position: absolute; top: 0; bottom: 0; width: 12%; z-index: 5; cursor: pointer;
  }
  .cs-edge-prev { left: 0; }
  .cs-edge-next { right: 0; }

  .cs-dots {
    flex-shrink: 0; display: flex; justify-content: center; gap: 8px;
    padding: 8px 0 10px; border-top: 1px solid var(--border);
  }
  .cs-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border); cursor: pointer; transition: background 0.2s;
  }
  .cs-dot.active { background: var(--gold); }

  .cs-section-hdr {
    font-family: 'Cinzel', serif; font-size: 9px; font-weight: 600;
    letter-spacing: 0.2em; color: var(--gold-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
    margin-bottom: 8px; margin-top: 14px;
  }
  .cs-section-hdr:first-child { margin-top: 0; }

  .cs-ability-grid {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 6px;
  }
  .cs-ability-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 8px 4px; text-align: center;
  }
  .cs-ability-label {
    font-family: 'Cinzel', serif; font-size: 8px;
    letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 2px;
  }
  .cs-ability-mod {
    font-family: 'Cinzel Decorative', serif; font-size: 22px;
    font-weight: 700; color: var(--gold); line-height: 1;
  }
  .cs-ability-score {
    font-family: 'Josefin Sans', sans-serif; font-size: 10px;
    color: var(--text-dim); margin-top: 2px;
  }

  .cs-meta-row { display: flex; gap: 6px; margin-top: 8px; }
  .cs-meta-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 8px; text-align: center;
  }
  .cs-meta-box-val {
    font-family: 'Cinzel', serif; font-size: 16px;
    color: var(--gold); font-weight: 700;
  }
  .cs-meta-box-lbl {
    font-family: 'Josefin Sans', sans-serif; font-size: 8px;
    letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase;
  }

  .cs-check-row {
    display: flex; align-items: center; gap: 6px; padding: 3px 0;
    font-family: 'IM Fell English', serif; font-size: 13px; color: var(--text);
  }
  .cs-check-circle {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--gold-dim); flex-shrink: 0;
  }
  .cs-check-circle.filled { background: var(--gold); border-color: var(--gold); }
  .cs-check-bonus {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); min-width: 24px; text-align: right;
  }
  .cs-check-tag {
    font-family: 'Josefin Sans', sans-serif; font-size: 8px;
    color: var(--text-dim); letter-spacing: 0.1em; margin-left: auto;
  }

  .cs-combat-row { display: flex; gap: 6px; }
  .cs-combat-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 8px 6px; text-align: center;
  }
  .cs-combat-val {
    font-family: 'Cinzel Decorative', serif; font-size: 22px;
    font-weight: 700; color: var(--gold);
  }
  .cs-combat-lbl {
    font-family: 'Josefin Sans', sans-serif; font-size: 8px;
    letter-spacing: 0.12em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 2px;
  }

  .cs-hp-row { display: flex; gap: 6px; }
  .cs-hp-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 8px 6px; text-align: center;
  }
  .cs-hp-val {
    font-family: 'Cinzel', serif; font-size: 18px;
    font-weight: 700; color: var(--text);
  }
  .cs-hp-lbl {
    font-family: 'Josefin Sans', sans-serif; font-size: 8px;
    letter-spacing: 0.12em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 2px;
  }

  .cs-death-saves { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
  .cs-save-row { display: flex; align-items: center; gap: 8px; }
  .cs-save-lbl {
    font-family: 'Josefin Sans', sans-serif; font-size: 10px;
    letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase; min-width: 68px;
  }
  .cs-save-circles { display: flex; gap: 5px; }
  .cs-save-circle {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid var(--gold-dim);
  }

  .cs-attack-hdr, .cs-attack-row {
    display: grid; grid-template-columns: 1fr 52px 80px;
    gap: 4px; align-items: center; padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .cs-attack-hdr {
    font-family: 'Josefin Sans', sans-serif; font-size: 9px;
    letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase;
    border-bottom-color: var(--gold-dim);
  }
  .cs-attack-row { font-family: 'IM Fell English', serif; font-size: 13px; color: var(--text); }
  .cs-attack-bonus { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold); text-align: center; }
  .cs-attack-dmg { font-family: 'Cinzel', serif; font-size: 10px; color: var(--text-dim); text-align: right; }

  .cs-trait-label {
    font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.15em;
    color: var(--gold-dim); text-transform: uppercase;
    margin-bottom: 3px; margin-top: 12px;
  }
  .cs-trait-label:first-child { margin-top: 0; }
  .cs-trait-text {
    font-family: 'IM Fell English', serif; font-size: 13px;
    color: var(--text); line-height: 1.5; font-style: italic;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }

  .cs-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .cs-list-item {
    font-family: 'IM Fell English', serif; font-size: 13px;
    color: var(--text); padding-left: 12px; position: relative;
  }
  .cs-list-item::before { content: '·'; position: absolute; left: 0; color: var(--gold-dim); }

  .cs-spell-level-hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; margin-bottom: 5px;
  }
  .cs-spell-level-label {
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 0.15em; color: var(--gold-dim); text-transform: uppercase;
  }
  .cs-slot-circles { display: flex; gap: 4px; }
  .cs-slot-circle {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--gold-dim);
  }

  .cs-no-spells {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 55%; gap: 10px; opacity: 0.5;
  }
  .cs-no-spells-icon { font-size: 38px; }
  .cs-no-spells-text {
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase;
    text-align: center;
  }
</style>
</head>
<body>
<div class="sc-page">
  <div class="sc-topbar">
    <button class="sc-back-btn" onclick="history.back()">&#8592; BACK</button>
    <div class="sc-topbar-title">
      <span class="sc-char-name" id="scCharName"></span>
      <span class="sc-lvl-badge">LVL 1</span>
    </div>
    <span class="sc-module-tag">Lost Mines of Phandelver</span>
    <button class="cs-sheet-btn" onclick="openCharSheet()" title="Character Sheet">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <circle cx="8" cy="5.5" r="2.5"/>
        <path d="M1.5 15c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Initiative tracker (combat only) -->
  <div class="combat-tracker" id="combatTracker" style="display:none">
    <div class="combat-tracker-header">
      <span class="combat-round-label" id="combatRoundLabel">Round 1</span>
    </div>
    <div class="combat-order" id="combatOrder"></div>
  </div>

  <div class="sc-log" id="scLog"></div>
  <div class="sc-typing" id="scTyping" style="display:none">The DM is writing…</div>

  <!-- Exploration input -->
  <div class="sc-input-row" id="explorationInput">
    <input class="sc-input" id="scInput" type="text" placeholder="Say something…" autocomplete="off" />
    <button class="sc-send-btn" id="scSendBtn" onclick="sendMessage()">SEND</button>
  </div>

  <!-- Combat action bar -->
  <div class="combat-input-row" id="combatInput" style="display:none">
    <div class="combat-waiting-label" id="combatWaiting" style="display:none"></div>
    <div class="action-sections" id="actionSections" style="display:none"></div>
  </div>
</div>

<!-- d20 roll overlay -->
<div class="roll-overlay" id="rollOverlay" style="display:none">
  <div class="d20-frame">
    <div class="d20-label">Rolling…</div>
    <div class="d20-number" id="d20Number">?</div>
    <div class="d20-result-line" id="d20ResultLine"></div>
  </div>
</div>

<!-- Character sheet drawer -->
<div id="csOverlay" class="cs-overlay" onclick="closeCharSheet()"></div>
<div id="csDrawer" class="cs-drawer">
  <button class="cs-close-btn" onclick="closeCharSheet()">&#10005;</button>
  <div class="cs-hdr">
    <div class="cs-hdr-name" id="csHdrName"></div>
    <div class="cs-hdr-class" id="csHdrClass"></div>
    <div class="cs-hdr-meta" id="csHdrMeta"></div>
  </div>
  <div class="cs-panels-wrap" id="csPanelsWrap">
    <div class="cs-edge-prev" onclick="csPrevPanel()"></div>
    <div class="cs-edge-next" onclick="csNextPanel()"></div>
    <div class="cs-panels" id="csPanels">
      <div class="cs-panel" id="csPanel0"></div>
      <div class="cs-panel" id="csPanel1"></div>
      <div class="cs-panel" id="csPanel2"></div>
      <div class="cs-panel" id="csPanel3"></div>
    </div>
  </div>
  <div class="cs-dots" id="csDots">
    <div class="cs-dot active" onclick="goToPanel(0)"></div>
    <div class="cs-dot" onclick="goToPanel(1)"></div>
    <div class="cs-dot" onclick="goToPanel(2)"></div>
    <div class="cs-dot" onclick="goToPanel(3)"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script type="module">
  import { CHARS } from './services/characters.js';
  import { SHEETS } from './services/characters.js';
  import { initFirebase } from './services/firebase.js';
  import * as Combat from './services/combat.js';
  import { rollAttack, rollDamage, checkHit } from './services/dice.js';

  // ── Character data ───────────────────────────────────────────────
  const CHAR_COLORS = {
    dennis: '#9b59b6', mac: '#e67e22', charlie: '#27ae60',
    dee: '#e91e8c', frank: '#c0392b', dm: '#c9a84c',
  };

  const ATTACK_BONUS = { dennis: 5, mac: 5, charlie: 6, dee: 4, frank: 5 };

  const DAMAGE_DICE = {
    dennis: { dice: '1d6', mod: 3 },
    mac:    { dice: '1d8', mod: 3 },
    charlie:{ dice: '1d6', mod: 4 },
    dee:    { dice: '1d8', mod: 2 },
    frank:  { dice: '1d12', mod: 3 },
  };

  // STR mod for shove (d20 + STR mod vs target STR)
  const STR_MOD = { dennis: -1, mac: 3, charlie: 0, dee: -1, frank: 3 };

  // Spells by character (level 1 sheets)
  const SPELLS = {
    dennis: [
      { name: 'Ray of Frost',  type: 'cantrip' },
      { name: 'Magic Missile', type: '1st lvl' },
      { name: 'Mage Hand',     type: 'cantrip' },
      { name: 'Shield',        type: '1st lvl' },
    ],
    charlie: [
      { name: 'Shillelagh',   type: 'cantrip' },
      { name: 'Thorn Spray',  type: 'cantrip' },
      { name: 'Entangle',     type: '1st lvl' },
      { name: 'Cure Wounds',  type: '1st lvl', heals: true, healDice: '1d8', healMod: 4 },
    ],
    dee: [
      { name: 'Vicious Mockery', type: 'cantrip' },
      { name: 'Charm Person',    type: '1st lvl' },
      { name: 'Cure Wounds',     type: '1st lvl', heals: true, healDice: '1d8', healMod: 2 },
    ],
  };

  const params = new URLSearchParams(location.search);
  const charId = params.get('character');
  const char   = CHARS.find(c => c.id === charId) || CHARS[0];

  document.getElementById('scCharName').textContent = char.name;
  document.title = char.name + ' — Summer Camp';

  // ── DOM refs ─────────────────────────────────────────────────────
  const log             = document.getElementById('scLog');
  const typingEl        = document.getElementById('scTyping');
  const input           = document.getElementById('scInput');
  const sendBtn         = document.getElementById('scSendBtn');
  const explorationEl   = document.getElementById('explorationInput');
  const combatInputEl   = document.getElementById('combatInput');
  const combatTrackerEl = document.getElementById('combatTracker');
  const combatOrderEl   = document.getElementById('combatOrder');
  const combatRoundEl   = document.getElementById('combatRoundLabel');
  const actionSectionsEl= document.getElementById('actionSections');
  const combatWaitEl    = document.getElementById('combatWaiting');
  const rollOverlay     = document.getElementById('rollOverlay');
  const d20NumberEl     = document.getElementById('d20Number');
  const d20ResultEl     = document.getElementById('d20ResultLine');

  // Firebase refs — assigned after initFirebase()
  let chatRef, stateRef, combatRef;

  // Per-turn state
  let frankReckless = false;
  let bonusActionUsed = false;

  // ── Message rendering ─────────────────────────────────────────────
  let activeMechanic = null;

  function toggleMechanic(div) {
    if (activeMechanic && activeMechanic !== div) {
      activeMechanic.style.display = 'none';
    }
    const isOpen = div.style.display !== 'none';
    div.style.display = isOpen ? 'none' : '';
    activeMechanic = isOpen ? null : div;
    log.scrollTop = log.scrollHeight;
  }

  const EVENT_ICON = { hp_change:'🗡️', spell_slot:'✨', death_save:'💀', status:'🌀', resource:'⚡' };

  function renderMsg(msg) {
    if (msg.type === 'system') {
      const el = document.createElement('div');
      el.className = 'msg-system';
      el.innerHTML = '<em>' + msg.text + '</em>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return;
    }
    if (msg.type === 'dm') {
      const wrap = document.createElement('div');
      wrap.className = 'chat-msg dm-msg';
      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = 'DM';
      sender.style.color = CHAR_COLORS.dm;
      wrap.appendChild(sender);

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      // Firebase converts arrays to numeric-keyed objects — handle both
      const sentences = Array.isArray(msg.sentences)
        ? msg.sentences : Object.values(msg.sentences || {});
      const events = Array.isArray(msg.mechanicalEvents)
        ? msg.mechanicalEvents : Object.values(msg.mechanicalEvents || {});

      if (sentences.length) {
        sentences.forEach(s => {
          const sentWrap = document.createElement('span');
          sentWrap.className = 'dm-sentence';
          sentWrap.textContent = s.text + ' ';
          if (s.mechanic) {
            const btn = document.createElement('button');
            btn.className = 'dm-info-btn';
            btn.textContent = 'ⓘ';
            const mechDiv = document.createElement('div');
            mechDiv.className = 'dm-mechanic';
            mechDiv.style.display = 'none';
            mechDiv.textContent = s.mechanic;
            btn.addEventListener('click', () => toggleMechanic(mechDiv));
            sentWrap.appendChild(btn);
            sentWrap.appendChild(mechDiv);
          }
          bubble.appendChild(sentWrap);
        });
      } else {
        bubble.textContent = msg.text;
      }

      wrap.appendChild(bubble);

      if (events.length) {
        const evStrip = document.createElement('div');
        evStrip.className = 'dm-events';
        events.forEach(ev => {
          const evEl = document.createElement('div');
          evEl.className = 'dm-event dm-event--' + (ev.type || '');
          evEl.textContent = (EVENT_ICON[ev.type] || '·') + ' ' + ev.display;
          if (ev.detail) {
            evEl.title = ev.detail;
            evEl.style.cursor = 'help';
          }
          evStrip.appendChild(evEl);
        });
        wrap.appendChild(evStrip);
      }

      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return;
    }
    if (msg.type === 'combat') {
      const wrap = document.createElement('div');
      wrap.className = 'chat-msg combat-msg ' + (msg.subtype || '');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = msg.text;
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return;
    }
    // Player message
    const isSelf = msg.characterId === char.id;
    const color  = CHAR_COLORS[msg.characterId] || '#c9a84c';
    const wrap   = document.createElement('div');
    wrap.className = 'chat-msg ' + (isSelf ? 'p-self' : 'p-other');
    const sender = document.createElement('div');
    sender.className = 'msg-sender';
    sender.textContent = msg.characterName;
    sender.style.color = color;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;
    bubble.style.borderColor = color;
    wrap.appendChild(sender);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  // ── Initiative tracker ────────────────────────────────────────────
  function renderTracker(state) {
    if (!state?.active) { combatTrackerEl.style.display = 'none'; return; }
    combatTrackerEl.style.display = '';
    combatRoundEl.textContent = 'Round ' + state.round;
    combatOrderEl.innerHTML = '';
    state.initiativeOrder.forEach((c, i) => {
      const pct  = c.maxHp > 0 ? c.hp / c.maxHp : 0;
      const dead = c.hp <= 0;
      const chip = document.createElement('div');
      chip.className = 'combatant-chip'
        + (i === state.currentTurnIndex && !dead ? ' current-turn' : '')
        + (dead ? ' dead' : '');
      const nameEl = document.createElement('div');
      nameEl.className = 'combatant-chip-name';
      nameEl.textContent = c.name.split(' ')[0];
      const track = document.createElement('div');
      track.className = 'hp-bar-track';
      const fill = document.createElement('div');
      fill.className = 'hp-bar-fill' + (pct <= 0.25 ? ' crit' : pct <= 0.5 ? ' low' : '');
      fill.style.width = Math.round(pct * 100) + '%';
      track.appendChild(fill);
      chip.appendChild(nameEl);
      chip.appendChild(track);
      combatOrderEl.appendChild(chip);
    });
  }

  // ── Combat action bar ─────────────────────────────────────────────
  function renderActionBar(state) {
    if (!state?.active) {
      combatInputEl.style.display = 'none';
      explorationEl.style.display = '';
      return;
    }
    explorationEl.style.display = 'none';
    combatInputEl.style.display = '';

    const currentTurn = state.initiativeOrder[state.currentTurnIndex];
    const myTurn = currentTurn && currentTurn.id === char.id && currentTurn.hp > 0;

    if (!myTurn) {
      combatWaitEl.style.display    = '';
      actionSectionsEl.style.display = 'none';
      const whose = currentTurn ? currentTurn.name.split(' ')[0] : '…';
      combatWaitEl.textContent = 'Waiting for ' + whose + '…';

      if (currentTurn?.type === 'enemy' && currentTurn.hp > 0) {
        const livingPlayers = state.initiativeOrder.filter(c => c.type === 'player' && c.hp > 0);
        if (livingPlayers.length && livingPlayers[0].id === char.id) {
          triggerEnemyTurn(currentTurn.id);
        }
      }
      return;
    }

    combatWaitEl.style.display    = 'none';
    actionSectionsEl.style.display = '';
    buildActionButtons(state);
  }

  // ── Action menu builder ───────────────────────────────────────────
  function buildActionButtons(state) {
    frankReckless    = false;
    bonusActionUsed  = false;
    const livingEnemies = state.initiativeOrder.filter(c => c.type === 'enemy' && c.hp > 0);
    actionSectionsEl.innerHTML = '';

    // ── ACTION section ──
    const actionRow = makeSection(actionSectionsEl, 'Action');
    addBtn(actionRow, 'Attack', '+' + ATTACK_BONUS[char.id],
      () => handleAttack(livingEnemies), !livingEnemies.length);
    if (SPELLS[char.id]) {
      addBtn(actionRow, 'Cast Spell', 'choose spell', () => showSpellMenu(state));
    }
    addBtn(actionRow, 'Shove', 'STR check', () => handleShove(livingEnemies), !livingEnemies.length);

    // ── BONUS ACTION section ──
    const bonusRow = makeSection(actionSectionsEl, 'Bonus Action');
    bonusRow.id = 'ba-row';
    const bonusActions = {
      dennis:  { label: 'Wild Magic',      bonus: 'chaos',       handler: handleWildMagic },
      mac:     { label: 'Divine Smite',    bonus: '+2d8 rad.',   handler: () => handleSmite(livingEnemies) },
      charlie: { label: 'Symbiotic Entity',bonus: 'spore boost', handler: handleSymbioticEntity },
      dee:     { label: 'Bardic Inspire',  bonus: 'd8 to ally',  handler: handleBardicInspiration },
      frank:   { label: 'Reckless Atk',   bonus: 'adv. toggle', handler: null, isToggle: true },
    };
    const ba = bonusActions[char.id];
    if (ba) {
      if (ba.isToggle) {
        const btn = makeBtn(ba.label, ba.bonus, null, false, 'special');
        btn.addEventListener('click', () => handleRecklessToggle(btn));
        bonusRow.appendChild(btn);
      } else {
        addBtn(bonusRow, ba.label, ba.bonus, ba.handler, false, 'special');
      }
    } else {
      const none = makeBtn('—', 'none');
      none.disabled = true;
      bonusRow.appendChild(none);
    }

    // ── OTHER section ──
    const otherRow = makeSection(actionSectionsEl, 'Other');
    addBtn(otherRow, 'Help',     'ally adv.',      () => handleSimpleAction('moves to assist, setting up an ally\'s next strike.'));
    addBtn(otherRow, 'Dodge',    'until next turn', () => handleSimpleAction('dodges, bracing for the next hit.'));
    addBtn(otherRow, 'Use Item', 'misc.',           () => handleSimpleAction('uses an item.'));
    addBtn(otherRow, 'End Turn', 'pass action',     () => handlePassTurn());
  }

  function makeSection(parent, label) {
    const sec = document.createElement('div');
    sec.className = 'action-section';
    const lbl = document.createElement('div');
    lbl.className = 'action-section-label';
    lbl.textContent = label;
    const row = document.createElement('div');
    row.className = 'action-row';
    sec.appendChild(lbl);
    sec.appendChild(row);
    parent.appendChild(sec);
    return row;
  }

  function makeBtn(label, bonus, handler, disabled = false, extraClass = '') {
    const btn = document.createElement('button');
    btn.className = 'action-btn' + (extraClass ? ' ' + extraClass : '');
    btn.disabled = disabled;
    btn.innerHTML = label + '<span class="action-bonus">' + bonus + '</span>';
    if (handler) btn.addEventListener('click', handler);
    return btn;
  }

  function addBtn(row, label, bonus, handler, disabled = false, extraClass = '') {
    row.appendChild(makeBtn(label, bonus, handler, disabled, extraClass));
  }

  function disableActions() {
    actionSectionsEl.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  function disableBonusBtn() {
    document.getElementById('ba-row')?.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  // ── Spell sub-menu ────────────────────────────────────────────────
  function showSpellMenu(state) {
    actionSectionsEl.innerHTML = '';
    const row = makeSection(actionSectionsEl, 'Choose a spell — or');
    const backBtn = makeBtn('← Back', 'cancel', () => buildActionButtons(state));
    row.appendChild(backBtn);
    (SPELLS[char.id] || []).forEach(spell => {
      addBtn(row, spell.name, spell.type, () => handleCastSpell(spell));
    });
  }

  async function handleCastSpell(spell) {
    disableActions();
    let text = `${char.name} casts ${spell.name}.`;
    let subtype = 'hit';
    if (spell.heals) {
      const { total } = rollDamage(spell.healDice, spell.healMod);
      await Combat.applyHealing(char.id, total);
      text = `${char.name} casts ${spell.name} — heals for ${total} HP.`;
      subtype = 'heal';
    }
    await chatRef.push({ type: 'combat', subtype, characterId: char.id, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  // ── d20 animation ─────────────────────────────────────────────────
  function animateRoll(finalRoll) {
    return new Promise(resolve => {
      rollOverlay.style.display = 'flex';
      d20NumberEl.className = 'd20-number';
      d20ResultEl.textContent = '';
      let ticks = 0;
      const iv = setInterval(() => {
        d20NumberEl.textContent = Math.floor(Math.random() * 20) + 1;
        if (++ticks >= 12) {
          clearInterval(iv);
          d20NumberEl.textContent = finalRoll;
          if (finalRoll === 20)    { d20NumberEl.className = 'd20-number crit';   d20ResultEl.textContent = 'CRITICAL HIT'; }
          else if (finalRoll === 1){ d20NumberEl.className = 'd20-number fumble'; d20ResultEl.textContent = 'FUMBLE'; }
          setTimeout(() => { rollOverlay.style.display = 'none'; resolve(); }, 700);
        }
      }, 40);
    });
  }

  // ── Attack ────────────────────────────────────────────────────────
  async function handleAttack(livingEnemies, extraDamageDice) {
    if (!livingEnemies.length) return;
    disableActions();
    const target = livingEnemies[0];
    let attackResult;
    if (frankReckless) {
      const r1 = rollAttack(ATTACK_BONUS[char.id]);
      const r2 = rollAttack(ATTACK_BONUS[char.id]);
      attackResult = r1.total >= r2.total ? r1 : r2;
    } else {
      attackResult = rollAttack(ATTACK_BONUS[char.id]);
    }
    await animateRoll(attackResult.roll);

    const hit    = checkHit(attackResult.total, target.ac);
    const dmgCfg = DAMAGE_DICE[char.id];
    let damage = 0, subtype = 'miss', combatText;

    if (hit) {
      const extra  = extraDamageDice ? rollDamage(extraDamageDice, 0).total : 0;
      damage = rollDamage(dmgCfg.dice, dmgCfg.mod).total + extra;
      subtype = attackResult.isCrit ? 'crit' : 'hit';
      await Combat.applyDamage(target.id, damage);
      combatText = `${char.name} attacks ${target.name} — roll ${attackResult.total} vs AC ${target.ac}. Hit! ${damage} damage${extraDamageDice ? ' (includes smite)' : ''}${frankReckless ? ' (reckless)' : ''}.`;
    } else {
      combatText = `${char.name} attacks ${target.name} — roll ${attackResult.total} vs AC ${target.ac}. Miss${frankReckless ? ' (reckless)' : ''}.`;
    }

    await chatRef.push({ type: 'combat', subtype, characterId: char.id, text: combatText, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(combatText);
  }

  async function handleSmite(livingEnemies) {
    await handleAttack(livingEnemies, '2d8');
  }

  // ── Shove ─────────────────────────────────────────────────────────
  async function handleShove(livingEnemies) {
    if (!livingEnemies.length) return;
    disableActions();
    const target = livingEnemies[0];
    const myRoll = rollAttack(STR_MOD[char.id] || 0);
    await animateRoll(myRoll.roll);
    const targetStr = 10; // simplified — no target STR stat stored
    const targetRoll = Math.floor(Math.random() * 20) + 1 + Math.floor((targetStr - 10) / 2);
    const success = myRoll.total >= targetRoll;
    const text = success
      ? `${char.name} shoves ${target.name} — roll ${myRoll.total} vs ${targetRoll}. Knocked prone!`
      : `${char.name} tries to shove ${target.name} — roll ${myRoll.total} vs ${targetRoll}. No effect.`;
    await chatRef.push({ type: 'combat', subtype: success ? 'hit' : 'miss', characterId: char.id, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  // ── Simple action ─────────────────────────────────────────────────
  async function handleSimpleAction(flavorText) {
    disableActions();
    const text = `${char.name} ${flavorText}`;
    await chatRef.push({ type: 'player', characterId: char.id, characterName: char.name, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  async function handlePassTurn() {
    disableActions();
    const text = `${char.name} holds position, waiting.`;
    await chatRef.push({ type: 'combat', subtype: 'miss', characterId: char.id, text, timestamp: Date.now() });
    await Combat.advanceTurn();
    await callDM(text);
  }

  // ── Bonus actions ─────────────────────────────────────────────────
  function handleRecklessToggle(btn) {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    frankReckless = true;
    // Mark the button active, leave attack buttons enabled
    btn.classList.add('active');
    btn.innerHTML = 'Reckless ON<span class="action-bonus">adv. active</span>';
    btn.disabled = true;
    chatRef.push({ type: 'combat', subtype: 'hit', characterId: char.id,
      text: `${char.name} commits to reckless attacks — advantage on attacks, enemies have advantage back.`,
      timestamp: Date.now() });
  }

  async function handleWildMagic() {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    disableBonusBtn();
    const r = Math.floor(Math.random() * 20) + 1;
    const effects = [
      'a random fireball erupts centered on Dennis',
      'Dennis turns invisible until he attacks',
      'Dennis and the nearest creature swap positions',
      'flower petals rain from the sky — no game effect',
      'Dennis grows 1 foot taller',
      'a third eye opens on Dennis\'s forehead',
      'all doors within 60ft slam shut simultaneously',
      'Dennis\'s hair turns bright blue',
      'a spectral hand slaps the nearest enemy',
      'everyone in 30ft is deafened for 1 minute',
    ];
    const text = `WILD MAGIC SURGE (d20: ${r}): ${effects[r % effects.length]}.`;
    await chatRef.push({ type: 'combat', subtype: 'crit', characterId: char.id, text, timestamp: Date.now() });
    await callDM(text);
  }

  async function handleSymbioticEntity() {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    disableBonusBtn();
    const text = `${char.name} activates Symbiotic Entity — spores coat their body, dealing 4d6 necrotic on hit until short rest.`;
    await chatRef.push({ type: 'combat', subtype: 'hit', characterId: char.id, text, timestamp: Date.now() });
    await callDM(text);
  }

  async function handleBardicInspiration() {
    if (bonusActionUsed) return;
    bonusActionUsed = true;
    disableBonusBtn();
    const allies = ['Mac', 'Dennis', 'Charlie', 'Dee', 'Frank'].filter(n => n.toLowerCase() !== char.id);
    const target = allies[Math.floor(Math.random() * allies.length)];
    const text = `${char.name} grants Bardic Inspiration to ${target} — add a d8 to your next roll.`;
    await chatRef.push({ type: 'combat', subtype: 'heal', characterId: char.id, text, timestamp: Date.now() });
    await callDM(text);
  }

  // ── Enemy turn ────────────────────────────────────────────────────
  let enemyTurnInProgress = false;
  async function triggerEnemyTurn(enemyId) {
    if (enemyTurnInProgress) return;
    enemyTurnInProgress = true;
    try {
      const result = await Combat.getEnemyAction(enemyId);
      if (!result?.attacks?.length) return;

      const lines = [];
      for (const atk of result.attacks) {
        const subtype = atk.hit ? (atk.isCrit ? 'crit' : 'hit') : 'miss';
        const text = atk.hit
          ? `${result.attacker} attacks ${atk.target} — roll ${atk.total}. Hit! ${atk.damage} damage.`
          : `${result.attacker} attacks ${atk.target} — roll ${atk.total}. Miss.`;
        await chatRef.push({ type: 'combat', subtype, characterId: 'dm', text, timestamp: Date.now() });
        lines.push(text);
      }
      await callDM(lines.join(' '));
    } finally {
      enemyTurnInProgress = false;
    }
  }

  // ── DM call ───────────────────────────────────────────────────────
  async function callDM(combatContext) {
    const stateSnap = await stateRef.once('value');
    if (stateSnap.val()?.thinking) return;

    const combatSnap   = await combatRef.once('value');
    const combatActive = combatSnap.val()?.active || false;

    await stateRef.set({ thinking: true });
    try {
      const snap = await chatRef.once('value');
      const msgs = snap.val();
      const history = msgs ? Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp).map(m => ({
        role:    m.type === 'dm' ? 'assistant' : 'user',
        content: m.type === 'player' ? m.characterName + ': ' + m.text : m.text,
      })) : [];

      const res = await fetch('/api/dm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, combatContext: combatContext || null, combatActive }),
      });
      if (!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();

      const narration = data.narrative || data.narration || 'The dungeon falls silent.';
      const dmMsg = { type: 'dm', characterId: 'dm', characterName: 'DM', text: narration, timestamp: Date.now() };
      if (data.sentences?.length)        dmMsg.sentences        = data.sentences;
      if (data.mechanicalEvents?.length) dmMsg.mechanicalEvents = data.mechanicalEvents;
      await chatRef.push(dmMsg);

      if (data.combatTrigger && !combatActive && data.combatTrigger.enemies?.length) {
        await Combat.startCombat(data.combatTrigger.enemies);
        await chatRef.push({ type: 'system', text: '⚔️ Roll for initiative.', timestamp: Date.now() });
      }

      if (data.combatEnd && combatActive) {
        await Combat.endCombat();
        await chatRef.push({ type: 'system', text: '✓ Combat ended.', timestamp: Date.now() });
      }
    } catch (err) {
      console.error('[summer-camp] DM error:', err);
    } finally {
      await stateRef.set({ thinking: false });
    }
  }

  // ── Exploration send ──────────────────────────────────────────────
  function setBusy(busy) {
    sendBtn.disabled = busy;
    input.disabled   = busy;
  }

  // ── Firebase init ─────────────────────────────────────────────────
  initFirebase();
  const db = window.firebaseDb;

  if (!db) {
    renderMsg({ type: 'system', text: '⚠ Connection unavailable. Reload to try again.' });
    sendBtn.disabled = true;
    input.disabled   = true;
    input.placeholder = 'Connection unavailable';
  } else {
    chatRef   = db.ref('/sessions/lostmines/chat');
    stateRef  = db.ref('/sessions/lostmines/state');
    combatRef = db.ref('/sessions/lostmines/combat');

    chatRef.on('value', snapshot => {
      log.innerHTML = '';
      const msgs = snapshot.val();
      if (!msgs) { renderMsg({ type: 'system', text: 'Entering the dungeon…' }); return; }
      Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp).forEach(renderMsg);
    });

    stateRef.on('value', snapshot => {
      typingEl.style.display = snapshot.val()?.thinking ? '' : 'none';
    });

    combatRef.on('value', snapshot => {
      const state = snapshot.val();
      renderTracker(state);
      renderActionBar(state);
    });

    // ── Exploration mode send ───────────────────────────────────────
    async function triggerDM() { await callDM(null); }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = '';
      setBusy(true);
      await chatRef.push({ type: 'player', characterId: char.id, characterName: char.name, text, timestamp: Date.now() });
      await triggerDM();
      setBusy(false);
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    window.sendMessage = sendMessage;

    // ── Session init ────────────────────────────────────────────────
    async function init() {
      db.ref('/sessions/lostmines/presence').child(char.id).set({
        characterName: char.name, joined: Date.now(),
      });

      // Late-join: if combat is active and we're not in the order, add us
      const combatSnap = await combatRef.once('value');
      const combatState = combatSnap.val();
      if (combatState?.active) {
        const inOrder = combatState.initiativeOrder?.some(c => c.id === char.id);
        if (!inOrder) await Combat.addPlayerToCombat(char.id);
      }

      const snap = await chatRef.once('value');
      if (snap.val()) { input.focus(); return; }

      const stateSnap = await stateRef.once('value');
      if (stateSnap.val()?.thinking) { input.focus(); return; }

      setBusy(true);
      await stateRef.set({ thinking: true });
      try {
        const openingPrompt = 'The adventure begins. Set the opening scene on the Triboar Trail — the ambush. Dead horses, goblin arrows. Be brief and punchy. Talk to the whole group.';
        const res = await fetch('/api/dm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'user', content: openingPrompt }], combatActive: false }),
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();
        const text = data.narrative || data.narration || 'The Triboar Trail stretches into shadow.';
        const openMsg = { type: 'dm', characterId: 'dm', characterName: 'DM', text, timestamp: Date.now() };
        if (data.sentences?.length)        openMsg.sentences        = data.sentences;
        if (data.mechanicalEvents?.length) openMsg.mechanicalEvents = data.mechanicalEvents;
        await chatRef.push(openMsg);
      } catch (err) {
        await chatRef.push({ type: 'dm', characterId: 'dm', characterName: 'DM', text: 'The Triboar Trail stretches into shadow. Something moves in the trees.', timestamp: Date.now() });
        console.error('[summer-camp] opening scene:', err);
      } finally {
        await stateRef.set({ thinking: false });
      }
      setBusy(false);
      input.focus();
    }

    init();
  }

  const ALL_SKILLS = [
    ['Acrobatics','DEX'],['Animal Handling','WIS'],['Arcana','INT'],
    ['Athletics','STR'],['Deception','CHA'],['History','INT'],
    ['Insight','WIS'],['Intimidation','CHA'],['Investigation','INT'],
    ['Medicine','WIS'],['Nature','INT'],['Perception','WIS'],
    ['Performance','CHA'],['Persuasion','CHA'],['Religion','INT'],
    ['Sleight of Hand','DEX'],['Stealth','DEX'],['Survival','WIS'],
  ];
  const AB_KEY = {STR:'str',DEX:'dex',CON:'con',INT:'int',WIS:'wis',CHA:'cha'};

  function csMod(score) { return Math.floor((score - 10) / 2); }
  function csFmt(n) { return (n >= 0 ? '+' : '') + n; }
  function csEl(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  let csCurrentPanel = 0;

  function goToPanel(n) {
    csCurrentPanel = Math.max(0, Math.min(3, n));
    document.getElementById('csPanels').style.transform =
      'translateX(' + (-csCurrentPanel * 25) + '%)';
    document.querySelectorAll('.cs-dot').forEach((d, i) =>
      d.classList.toggle('active', i === csCurrentPanel));
  }

  function buildCharSheet() {
    const sd = SHEETS[char.id]?.level1;
    const ex = SHEET_EXTRA[char.id];
    if (!sd || !ex) return;

    document.getElementById('csHdrName').textContent = char.name;
    document.getElementById('csHdrClass').textContent =
      (sd.class || char.cls) + ' · Level 1';
    document.getElementById('csHdrMeta').textContent =
      ex.race + ' · ' + ex.background + ' · ' + ex.alignment;

    const S = {str:sd.str,dex:sd.dex,con:sd.con,int:sd.int,wis:sd.wis,cha:sd.cha};
    const prof = 2;

    // ── Panel 0: Abilities & Skills ─────────────────────
    const p0 = document.getElementById('csPanel0');
    p0.innerHTML = '';

    p0.appendChild(csEl('div','cs-section-hdr','Ability Scores'));
    const grid = csEl('div','cs-ability-grid');
    ['STR','DEX','CON','INT','WIS','CHA'].forEach(ab => {
      const score = S[AB_KEY[ab]];
      const m = csMod(score);
      const box = csEl('div','cs-ability-box');
      box.appendChild(csEl('div','cs-ability-label',ab));
      box.appendChild(csEl('div','cs-ability-mod', csFmt(m)));
      box.appendChild(csEl('div','cs-ability-score', score));
      grid.appendChild(box);
    });
    p0.appendChild(grid);

    const metaRow = csEl('div','cs-meta-row');
    const inspBox = csEl('div','cs-meta-box');
    inspBox.appendChild(csEl('div','cs-meta-box-val','○'));
    inspBox.appendChild(csEl('div','cs-meta-box-lbl','Inspiration'));
    const profBox = csEl('div','cs-meta-box');
    profBox.appendChild(csEl('div','cs-meta-box-val','+'+prof));
    profBox.appendChild(csEl('div','cs-meta-box-lbl','Proficiency'));
    metaRow.appendChild(inspBox);
    metaRow.appendChild(profBox);
    p0.appendChild(metaRow);

    p0.appendChild(csEl('div','cs-section-hdr','Saving Throws'));
    ['STR','DEX','CON','INT','WIS','CHA'].forEach(ab => {
      const key = AB_KEY[ab];
      const isPro = ex.savingThrows.includes(key);
      const val = csMod(S[key]) + (isPro ? prof : 0);
      const row = csEl('div','cs-check-row');
      row.appendChild(csEl('div','cs-check-circle'+(isPro?' filled':'')));
      row.appendChild(csEl('div','cs-check-bonus', csFmt(val)));
      row.appendChild(csEl('span','',ab));
      p0.appendChild(row);
    });

    p0.appendChild(csEl('div','cs-section-hdr','Skills'));
    ALL_SKILLS.forEach(([skillName, abilityTag]) => {
      const key = AB_KEY[abilityTag];
      const stored = sd.skills?.[skillName];
      const isPro = stored !== undefined;
      const val = isPro ? stored : csMod(S[key]);
      const row = csEl('div','cs-check-row');
      row.appendChild(csEl('div','cs-check-circle'+(isPro?' filled':'')));
      row.appendChild(csEl('div','cs-check-bonus', csFmt(val)));
      row.appendChild(csEl('span','',skillName));
      row.appendChild(csEl('span','cs-check-tag',abilityTag));
      p0.appendChild(row);
    });

    // ── Panel 1: Combat ─────────────────────────────────
    const p1 = document.getElementById('csPanel1');
    p1.innerHTML = '';

    p1.appendChild(csEl('div','cs-section-hdr','Core Stats'));
    const combatRow = csEl('div','cs-combat-row');
    [['AC',sd.ac],['Initiative',csFmt(csMod(S.dex))],['Speed',sd.speed+' ft']].forEach(([lbl,val]) => {
      const box = csEl('div','cs-combat-box');
      box.appendChild(csEl('div','cs-combat-val',val));
      box.appendChild(csEl('div','cs-combat-lbl',lbl));
      combatRow.appendChild(box);
    });
    p1.appendChild(combatRow);

    p1.appendChild(csEl('div','cs-section-hdr','Hit Points'));
    const hpRow = csEl('div','cs-hp-row');
    [['Max',sd.hp],['Current','—'],['Temp','—']].forEach(([lbl,val]) => {
      const box = csEl('div','cs-hp-box');
      box.appendChild(csEl('div','cs-hp-val',val));
      box.appendChild(csEl('div','cs-hp-lbl',lbl+' HP'));
      hpRow.appendChild(box);
    });
    p1.appendChild(hpRow);

    p1.appendChild(csEl('div','cs-section-hdr','Hit Dice & Death Saves'));
    const hdRow = csEl('div','cs-meta-row');
    const hdBox = csEl('div','cs-meta-box');
    hdBox.appendChild(csEl('div','cs-meta-box-val','1'+ex.hitDie));
    hdBox.appendChild(csEl('div','cs-meta-box-lbl','Hit Dice'));
    hdRow.appendChild(hdBox);
    p1.appendChild(hdRow);

    const deathWrap = csEl('div','cs-death-saves');
    ['Successes','Failures'].forEach(lbl => {
      const row = csEl('div','cs-save-row');
      row.appendChild(csEl('div','cs-save-lbl',lbl));
      const circles = csEl('div','cs-save-circles');
      for (let i=0;i<3;i++) circles.appendChild(csEl('div','cs-save-circle'));
      row.appendChild(circles);
      deathWrap.appendChild(row);
    });
    p1.appendChild(deathWrap);

    p1.appendChild(csEl('div','cs-section-hdr','Attacks & Spellcasting'));
    const atkHdr = csEl('div','cs-attack-hdr');
    atkHdr.innerHTML = '<span>Name</span><span style="text-align:center">Atk</span><span style="text-align:right">Dmg / Type</span>';
    p1.appendChild(atkHdr);
    ex.attacks.forEach(atk => {
      const row = csEl('div','cs-attack-row');
      row.appendChild(csEl('span','',atk.name));
      row.appendChild(csEl('span','cs-attack-bonus',atk.bonus));
      row.appendChild(csEl('span','cs-attack-dmg',atk.dmg));
      p1.appendChild(row);
    });

    // ── Panel 2: Character ───────────────────────────────
    const p2 = document.getElementById('csPanel2');
    p2.innerHTML = '';

    p2.appendChild(csEl('div','cs-section-hdr','Personality'));
    [['Traits',ex.traits],['Ideals',ex.ideals],['Bonds',ex.bonds],['Flaws',ex.flaws]].forEach(([lbl,txt]) => {
      p2.appendChild(csEl('div','cs-trait-label',lbl));
      p2.appendChild(csEl('div','cs-trait-text',txt));
    });

    p2.appendChild(csEl('div','cs-section-hdr','Features & Traits'));
    const featList = csEl('ul','cs-list');
    (sd.features||[]).forEach(f => featList.appendChild(csEl('li','cs-list-item',f)));
    p2.appendChild(featList);

    p2.appendChild(csEl('div','cs-section-hdr','Equipment'));
    const eqList = csEl('ul','cs-list');
    (sd.equipment||[]).forEach(e => eqList.appendChild(csEl('li','cs-list-item',e)));
    p2.appendChild(eqList);

    p2.appendChild(csEl('div','cs-section-hdr','Proficiencies & Languages'));
    const profList = csEl('ul','cs-list');
    [ex.languages, ex.otherProfs].forEach(s =>
      (s||'').split(', ').forEach(p => { if(p) profList.appendChild(csEl('li','cs-list-item',p)); }));
    p2.appendChild(profList);

    // ── Panel 3: Spells ──────────────────────────────────
    const p3 = document.getElementById('csPanel3');
    p3.innerHTML = '';

    const hasSpells = ex.spellcastingAbility &&
      (sd.cantrips?.length || sd.spells_1?.length);

    if (!hasSpells) {
      const noSpells = csEl('div','cs-no-spells');
      noSpells.appendChild(csEl('div','cs-no-spells-icon','⚔'));
      noSpells.appendChild(csEl('div','cs-no-spells-text','No Spellcasting'));
      if (char.id === 'mac') {
        const note = csEl('div','cs-no-spells-text','Divine Smite listed in Attacks');
        note.style.fontSize = '10px';
        note.style.opacity = '0.7';
        noSpells.appendChild(note);
      }
      p3.appendChild(noSpells);
      return;
    }

    p3.appendChild(csEl('div','cs-section-hdr','Spellcasting'));
    const scRow = csEl('div','cs-meta-row');
    [['Ability',ex.spellcastingAbility],['Save DC',ex.spellSaveDC],['Atk Bonus',ex.spellAtkBonus]].forEach(([lbl,val]) => {
      const box = csEl('div','cs-meta-box');
      box.appendChild(csEl('div','cs-meta-box-val',val));
      box.appendChild(csEl('div','cs-meta-box-lbl',lbl));
      scRow.appendChild(box);
    });
    p3.appendChild(scRow);

    if (sd.cantrips?.length) {
      const hdr = csEl('div','cs-spell-level-hdr');
      hdr.appendChild(csEl('div','cs-spell-level-label','Cantrips'));
      hdr.appendChild(csEl('div','cs-spell-level-label','∞'));
      p3.appendChild(hdr);
      const list = csEl('ul','cs-list');
      sd.cantrips.forEach(s => list.appendChild(csEl('li','cs-list-item',s)));
      p3.appendChild(list);
    }

    [['1st Level', sd.spells_1, ex.spellSlots?.[1]],
     ['2nd Level', sd.spells_2, ex.spellSlots?.[2]]
    ].forEach(([levelLabel, spells, slots]) => {
      if (!spells?.length && !slots) return;
      const hdr = csEl('div','cs-spell-level-hdr');
      hdr.appendChild(csEl('div','cs-spell-level-label',levelLabel));
      if (slots) {
        const circles = csEl('div','cs-slot-circles');
        for (let i=0;i<slots;i++) circles.appendChild(csEl('div','cs-slot-circle'));
        hdr.appendChild(circles);
      }
      p3.appendChild(hdr);
      if (spells?.length) {
        const list = csEl('ul','cs-list');
        spells.forEach(s => list.appendChild(csEl('li','cs-list-item',s)));
        p3.appendChild(list);
      }
    });
  }

  function openCharSheet() {
    buildCharSheet();
    goToPanel(0);
    document.getElementById('csOverlay').classList.add('open');
    document.getElementById('csDrawer').classList.add('open');
  }

  function closeCharSheet() {
    document.getElementById('csOverlay').classList.remove('open');
    document.getElementById('csDrawer').classList.remove('open');
  }

  // Swipe detection
  (function() {
    const wrap = document.getElementById('csPanelsWrap');
    let tx = 0;
    wrap.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
    wrap.addEventListener('touchend', e => {
      const delta = e.changedTouches[0].clientX - tx;
      if (delta < -50) goToPanel(csCurrentPanel + 1);
      else if (delta > 50) goToPanel(csCurrentPanel - 1);
    }, {passive:true});
  })();

  window.openCharSheet  = openCharSheet;
  window.closeCharSheet = closeCharSheet;
  window.goToPanel      = goToPanel;
  window.csPrevPanel    = () => goToPanel(csCurrentPanel - 1);
  window.csNextPanel    = () => goToPanel(csCurrentPanel + 1);
</script>
