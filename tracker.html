<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Old Road Initiative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Same palette tokens as the soundboard (index.html). Single dark theme: run at a night table. */
:root{
  --bg:#13100d; --stone:#1d1814; --stone-2:#28211b; --line:#3b3129; --fg:#ece2d2; --muted:#a6978a;
  --ember:#e2712b; --ember-deep:#8a3c16; --flame:#ffbe6b; --blood:#c8412c; --moss:#93ad6e;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Noto Serif', Georgia, 'Times New Roman', serif;
  --mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding:0 16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(1200px 500px at 50% -200px, #2a1a10 0%, transparent 70%), var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}

/* page nav, shared with the soundboard */
.pages{display:flex;gap:2px;margin:0 -10px}
.pages a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.pages a:hover{color:var(--fg)}
.pages a[aria-current="page"]{color:var(--flame)}

h1{font-family:var(--display);font-weight:800;font-size:clamp(18px,3.4vw,24px);letter-spacing:.08em;margin:0 0 10px;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:400;font-style:italic;font-size:12px;letter-spacing:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--stone-2);border-radius:8px;padding:9px 14px;min-height:44px;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:13px}
.btn:hover{border-color:var(--ember-deep)}
.btn[aria-pressed="true"]{background:var(--ember-deep);border-color:var(--ember)}
.btn.danger{background:var(--blood);border-color:#e0604a;color:#fff}

/* sticky top: area filter and cue banners stay visible mid-fight */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;
  background:linear-gradient(var(--bg) 75%, rgba(19,16,13,.85));border-bottom:1px solid var(--line);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters[hidden]{display:none}
.cue{display:flex;align-items:center;gap:12px;border:1px solid var(--flame);border-radius:10px;padding:6px 6px 6px 14px;
  background:linear-gradient(90deg,#5a2410,#2a120a);box-shadow:0 0 22px -6px var(--ember)}
.cue b{flex:1;font-family:var(--display);font-weight:800;letter-spacing:.06em;color:var(--flame)}
.cue small{display:block;font-family:var(--body);font-weight:400;letter-spacing:0;color:var(--muted)}

main{display:flex;flex-direction:column;gap:26px;margin-top:18px}
.area-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.area-head h2{flex:1;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.1em;margin:0;text-transform:uppercase}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;border:1px dashed var(--blood);border-radius:10px;padding:8px 8px 8px 14px}
.confirm[hidden]{display:none}
.confirm span{flex:1;min-width:12em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}

.card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;
  background:linear-gradient(160deg,var(--stone-2),var(--stone));min-width:0}
.card-head{display:flex;align-items:baseline;gap:10px}
.card-head h3{flex:1;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;margin:0;overflow-wrap:anywhere}
.ac{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.hp{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.hp b{font-size:22px;color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--moss);transition:width .2s}
.bar[data-level="mid"] span{background:var(--ember)}
.bar[data-level="low"] span{background:var(--blood)}
.note{margin:0;font-size:13px;font-style:italic;color:var(--muted)}
.once{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.once input{width:22px;height:22px;accent-color:var(--ember);margin:0}
.dmg{display:flex;gap:6px}
.dmg input{flex:1;min-width:0;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:16px;font-family:var(--mono)}
.dmg .btn{padding-inline:10px}
.controls{display:flex;flex-direction:column;gap:10px}
/* attack rolls */
.attacks{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.atk-head{display:flex;align-items:center;gap:6px}
.atk-title{flex:1;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.atk-head .atk-title + .atk-title{flex:0;white-space:nowrap;font-style:italic;text-transform:none;letter-spacing:0}
.atk-mode{padding-inline:12px;font-size:12px}
.atk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.atk{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-align:left;padding:6px 10px;min-height:44px;min-width:0}
.atk b{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.03em}
.atk span{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--muted)}
.atk small{font-size:11px;font-style:italic;color:var(--muted);letter-spacing:0}
.atk.extra{border-style:dashed}
.atk.static{border:1px dashed var(--line);border-radius:8px}
.atk.static span{color:var(--flame);font-size:12px}
.atk-result:empty{display:none}
.atk-result{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.atk-result p{margin:0;display:flex;flex-direction:column}
.atk-result b{font-family:var(--mono);font-size:14px;font-weight:600}
.atk-result small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.atk-result .crit b{color:var(--flame)}
.atk-result .miss b{color:var(--muted)}
.revive{min-height:44px;border:1px dashed var(--blood);border-radius:8px;background:transparent;font-family:var(--display);font-weight:800;letter-spacing:.12em;color:#e9846f}
/* initiative */
.btn.next{background:var(--ember-deep);border-color:var(--ember)}
.btn:disabled{opacity:.4;cursor:default}
.turn[hidden],.setup[hidden]{display:none}
.turn{display:flex;flex-direction:column;gap:6px}
.turn-info{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.turn-info b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--flame)}
.turn-round,.turn-next{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.turn-next{margin-left:auto;text-transform:none;letter-spacing:0;font-style:italic}
.turn-btns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.order{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.entry{position:relative;display:flex;flex-direction:column;gap:4px;border-left:3px solid transparent;padding-left:10px}
.entry.now{border-left-color:var(--flame)}
.entry.now > .card,.entry.now > .hero-row{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 22px -6px var(--ember)}
.entry.waiting{opacity:.5}
.init{position:absolute;left:-1px;top:8px;transform:translateX(-50%);min-width:26px;text-align:center;font-family:var(--mono);font-size:11px;
  background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 5px;color:var(--muted)}
.entry.now .init{border-color:var(--flame);color:var(--flame)}
.joins{font-size:11px;font-style:italic;color:var(--muted)}
.hero-row{display:flex;align-items:center;gap:10px;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--stone)}
.hero-row b{font-family:var(--display);font-weight:600;font-size:16px}
.hero-player{flex:1;font-size:13px;font-style:italic;color:var(--muted)}
.fire-entry{border-style:dashed;border-color:var(--ember-deep)}
.fire-note{font-size:13px;color:var(--flame)}
.terrain-head{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.setup{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--stone);display:flex;flex-direction:column;gap:10px}
.setup-help{margin:0;font-size:13px;color:var(--muted)}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.setup-hero{display:flex;flex-direction:column;gap:3px;font-size:13px}
.setup-hero input{min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:16px;font-family:var(--mono)}
.setup-btns{display:flex;gap:8px;flex-wrap:wrap}

/* special abilities */
.event:empty{display:none}
.event{margin:0;border-left:3px solid var(--flame);padding:4px 0 4px 10px;font-size:13px;color:var(--fg)}
.atk[hidden],.redirect[hidden],.pick[hidden]{display:none}
.redirect{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.btn.fire{border-color:var(--ember-deep);color:var(--flame)}
.btn.fire:disabled{opacity:.4;cursor:default}
.fire-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.fire-out{font-size:13px;color:var(--muted);font-style:italic}
.card.down{border-color:#2a2420}
.card.down .stats{opacity:.45}
.card.down .controls{display:none}
.card:not(.down) .revive{display:none}

.empty{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="pages" aria-label="Pages"><a href="/">Soundboard</a><a href="/tracker" aria-current="page">Initiative</a></nav>
  <h1>Initiative Tracker<small>Shadow on the Old Road · Start fight, then Next turn · Enter in an amount field deals damage</small></h1>
  <div class="top">
    <div class="filters" id="filters" role="group" aria-label="Show area"></div>
    <div class="turn" id="turn" hidden></div>
    <div id="cues" role="status" aria-live="assertive"></div>
  </div>
  <main id="areas"><p class="empty">Loading monsters…</p></main>
</div>

<script>
(() => {
  // Everything persists in localStorage under the "oldroad_" prefix so a refresh or a closed tab keeps the fight.
  const KEY = 'oldroad_tracker', VIEW_KEY = 'oldroad_view', ROSTER_KEY = 'oldroad_monsters';
  const load = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  const saved = load(KEY, {});
  // cleansed: monster id -> blade cleansed (Shield of Flesh and Black Reaping off). fireOut: area id -> fire scattered.
  // fight: the running initiative order, or null. {area, round, turn, order: [{t: 'hero'|'monster'|'fire', id, roll}], arrived: [monster ids]}
  const state = {hp: saved.hp || {}, used: saved.used || {}, dismissed: saved.dismissed || {}, cleansed: saved.cleansed || {}, fireOut: saved.fireOut || {}, fight: saved.fight || null};
  const save = () => store(KEY, state);

  let areas = [], heroes = [];
  const monsters = {};            // id -> monster
  let view = load(VIEW_KEY, 'all');

  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const btn = (text, cls) => { const b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; return b; };

  const hpOf = m => { const v = state.hp[m.id]; return Number.isFinite(v) ? Math.min(m.hp, Math.max(0, v)) : m.hp; };

  /* ---------- cues (Ghashnakh) ---------- */
  const cueOn = (c, hp) => c.atOrBelow != null ? hp <= c.atOrBelow : hp < c.below;
  const cueKey = (m, c) => m.id + ':' + c.id;
  function renderCues(){
    const box = $('#cues'); box.textContent = '';
    for (const m of Object.values(monsters)) for (const c of (m.cues || [])) {
      if (!cueOn(c, hpOf(m)) || state.dismissed[cueKey(m, c)]) continue;
      const row = el('div', 'cue');
      const msg = el('b', null, c.text); msg.append(el('small', null, `${m.name} at ${hpOf(m)} HP`));
      const done = btn('Done'); done.addEventListener('click', () => { state.dismissed[cueKey(m, c)] = true; save(); renderCues(); });
      row.append(msg, done); box.append(row);
    }
  }

  /* ---------- HP changes ---------- */
  function setHp(m, next){
    const before = hpOf(m);
    const after = Math.min(m.hp, Math.max(0, Math.round(next)));
    state.hp[m.id] = after;
    // A cue shows when HP crosses into its range, and re-arms once HP climbs back out.
    for (const c of (m.cues || [])) if (cueOn(c, before) !== cueOn(c, after)) delete state.dismissed[cueKey(m, c)];
    save(); paintCard(m); renderCues();
  }

  /* ---------- special abilities from the DM guide ---------- */
  // Flags live on the stat blocks in monsters.json (orc, shieldOfFlesh, hideousToughness, redirect, parry, fearOfFire).
  const events = {};              // monster id -> last automatic thing that happened to it, shown on its card
  const lastHit = {};             // monster id -> HP it lost to the last damage entry (for Redirect Attack)
  const sbOf = m => statblocks[m.stats] || {};
  const areaOfMonster = m => areas.find(a => a.monsters.includes(m));
  // Orcs still standing in the same area, optionally excluding one (the guide's "orc allies").
  const orcsNear = (m, except) => areaOfMonster(m).monsters.filter(o => o !== except && sbOf(o).orc && hpOf(o) > 0);
  function note(m, text){ events[m.id] = text; paintCard(m); }

  // Every damage entry goes through here so the automatic abilities apply.
  function damage(m, n, {fire = false} = {}){
    const sb = sbOf(m), before = hpOf(m), msgs = [];
    // Shield of Flesh: while Ghashnakh holds the corrupted blade, the first 5 of each attack go to a random orc ally.
    // Assumes every orc in the area is within 30 ft. (true in the courtyard).
    if (sb.shieldOfFlesh && !state.cleansed[m.id]) {
      const allies = orcsNear(m, m);
      if (allies.length) {
        const ally = allies[Math.floor(Math.random() * allies.length)], moved = Math.min(sb.shieldOfFlesh, n);
        n -= moved; damage(ally, moved);
        note(ally, `Took ${moved} from ${m.name}'s Shield of Flesh.` + (events[ally.id] && /Hideous/.test(events[ally.id]) ? ' ' + events[ally.id] : ''));
        msgs.push(`Shield of Flesh: ${ally.name} took ${moved}, ${m.name} took ${n}.`);
      }
    }
    // Hideous Toughness: once, damage of 7 or less that would drop it leaves it at 1 HP.
    if (sb.hideousToughness && !state.used[m.id] && before > 0 && before - n <= 0 && n <= sb.hideousToughness) {
      state.used[m.id] = true;
      const cb = document.querySelector(`.card[data-id="${m.id}"] .once input`); if (cb) cb.checked = true;
      setHp(m, 1); lastHit[m.id] = before - 1;
      note(m, `Hideous Toughness! ${n} damage would have dropped it; it stays at 1 HP. (Used up.)`);
      return;
    }
    setHp(m, before - n);
    lastHit[m.id] = before - hpOf(m);
    // Fear of Fire: a warg hurt by fire checks Intimidation against DC 10 + the damage or flees.
    if (fire && sb.fearOfFire && n > 0 && hpOf(m) > 0) msgs.push(`Fear of Fire: Intimidation check DC ${10 + n}, or it flees until the end of its next turn.`);
    if (msgs.length) note(m, msgs.join(' '));
    else if (events[m.id]) { delete events[m.id]; paintCard(m); }
  }

  function paintCard(m){
    const card = document.querySelector(`.card[data-id="${m.id}"]`); if (!card) return;
    const hp = hpOf(m), pct = hp / m.hp;
    card.classList.toggle('down', hp === 0);
    card.querySelector('.hp b').textContent = hp;
    const bar = card.querySelector('.bar');
    bar.dataset.level = pct > .5 ? 'high' : pct > .25 ? 'mid' : 'low';
    bar.firstChild.style.width = (pct * 100) + '%';
    const ev = card.querySelector('.event'); ev.textContent = events[m.id] || '';
    const redirect = card.querySelector('.redirect');
    if (redirect) redirect.hidden = !(lastHit[m.id] > 0 && hp > 0 && orcsNear(m, m).length);
    // Black Reaping needs the corrupted blade.
    card.querySelectorAll('.atk[data-needs-blade]').forEach(b => b.hidden = !!state.cleansed[m.id]);
  }

  /* ---------- attack rolls ---------- */
  // Attacks live in monsters.json "statblocks", shared by every monster that points at one via "stats".
  // A "manual" stat block (the Balrog) only shows its numbers, for real dice at the table.
  let statblocks = {};
  const die = sides => 1 + Math.floor(Math.random() * sides);
  function rollDamage(expr, crit){
    const [, n, sides, mod = '0'] = /^(\d+)d(\d+)([+-]\d+)?$/.exec(expr.replace(/\s/g, ''));
    const rolls = Array.from({length: +n * (crit ? 2 : 1)}, () => die(+sides));   // a crit doubles the dice, not the modifier
    return {total: Math.max(0, rolls.reduce((s, r) => s + r, 0) + +mod), rolls, mod: +mod};
  }
  const showDice = d => d.rolls.join('+') + (d.mod ? (d.mod > 0 ? ' + ' : ' − ') + Math.abs(d.mod) : '');
  const formula = a => (a.hit != null ? `d20+${a.hit} · ` : '') + a.dmg + (a.type ? ' ' + a.type : '');

  // One line per target: to-hit (with advantage/disadvantage), crit on a natural 20, miss on a natural 1.
  function rollAttack(a, mode){
    const lines = [];
    const kind = a.type ? a.type + ' ' : '';
    if (a.hit == null) {
      const d = rollDamage(a.dmg, false);
      lines.push({cls: '', text: `${a.name}: ${d.total} ${kind}damage`, detail: `${a.dmg}: ${showDice(d)}` + (a.when ? ` · ${a.when}` : '')});
      return lines;
    }
    for (let t = 0; t < (a.targets || 1); t++) {
      const pair = [die(20), die(20)];
      const nat = mode === 'adv' ? Math.max(...pair) : mode === 'dis' ? Math.min(...pair) : pair[0];
      const d20 = mode === 'normal' ? `d20 ${nat}` : `d20 ${pair[0]}/${pair[1]} ${mode}`;
      const who = a.targets > 1 ? ` · target ${t + 1}` : '';
      if (nat === 1) { lines.push({cls: 'miss', text: `${a.name}${who}: miss (natural 1)`, detail: d20}); continue; }
      const crit = nat === 20, d = rollDamage(a.dmg, crit);
      lines.push({cls: crit ? 'crit' : '',
        text: `${a.name}${who}: ${crit ? 'CRIT · ' : ''}${nat + a.hit} to hit · ${d.total} ${kind}damage`,
        detail: `${d20} + ${a.hit}; ${a.dmg}${crit ? ' doubled' : ''}: ${showDice(d)}` + (a.save ? ` · ${a.save}` : '')});
    }
    return lines;
  }

  function attackSection(m){
    const sb = statblocks[m.stats]; if (!sb || !sb.attacks) return null;
    const box = el('div', 'attacks');
    const head = el('div', 'atk-head'); head.append(el('span', 'atk-title', sb.perTurn || 'Attack'));
    const out = el('output', 'atk-result'); out.setAttribute('aria-live', 'polite');
    let mode = 'normal';
    if (sb.manual) head.append(el('span', 'atk-title', 'Roll real dice'));
    else for (const [id, label] of [['adv', 'Adv'], ['dis', 'Dis']]) {
      const t = btn(label, 'atk-mode'); t.setAttribute('aria-pressed', 'false');
      t.title = id === 'adv' ? 'Advantage: roll two d20s, keep the higher' : 'Disadvantage: roll two d20s, keep the lower';
      t.addEventListener('click', () => {
        mode = mode === id ? 'normal' : id;
        head.querySelectorAll('.atk-mode').forEach(b => b.setAttribute('aria-pressed', b === t && mode === id));
      });
      head.append(t);
    }
    const grid = el('div', 'atk-grid');
    for (const a of sb.attacks) {
      const tip = [a.range, a.save, a.when].filter(Boolean).join(' · ');
      if (sb.manual) {
        const s = el('div', 'atk static'); s.append(el('b', null, a.name), el('span', null, formula(a)));
        if (tip) s.append(el('small', null, tip));
        grid.append(s); continue;
      }
      const b = el('button', 'btn atk' + (a.hit == null ? ' extra' : '')); b.type = 'button';
      b.append(el('b', null, a.name), el('span', null, formula(a)));
      if (tip) b.title = tip;
      if (a.needsBlade) b.dataset.needsBlade = '';
      b.addEventListener('click', () => {
        out.textContent = '';
        for (const l of rollAttack(a, mode)) { const p = el('p', l.cls); p.append(el('b', null, l.text), el('small', null, l.detail)); out.append(p); }
      });
      grid.append(b);
    }
    box.append(head, grid, out);
    return box;
  }

  function card(m){
    const c = el('article', 'card'); c.dataset.id = m.id;
    const stats = el('div', 'stats');
    const sb = sbOf(m);
    // Parry is a reaction after a hit, so it's a reminder: the AC it would take to beat it.
    const head = el('div', 'card-head'); head.append(el('h3', null, m.name), el('span', 'ac', 'AC ' + m.ac + (sb.parry ? ` · ${m.ac + sb.parry} Parry` : '')));
    const hp = el('div', 'hp'); hp.append(el('b'), document.createTextNode(' / ' + m.hp + ' HP'));
    const bar = el('div', 'bar'); bar.setAttribute('aria-hidden', 'true'); bar.append(el('span'));
    stats.append(head, hp, bar);
    if (m.note) stats.append(el('p', 'note', m.note));
    const ev = el('p', 'event'); ev.setAttribute('aria-live', 'polite');
    c.append(stats, ev);

    if (sb.shieldOfFlesh) {
      const lab = el('label', 'once'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!state.cleansed[m.id];
      cb.addEventListener('change', () => { if (cb.checked) state.cleansed[m.id] = true; else delete state.cleansed[m.id]; save(); paintCard(m); });
      lab.append(cb, document.createTextNode('Blade cleansed (no Shield of Flesh or Black Reaping)'));
      c.append(lab);
    }

    if (m.once) {
      const lab = el('label', 'once'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!state.used[m.id];
      cb.addEventListener('change', () => { if (cb.checked) state.used[m.id] = true; else delete state.used[m.id]; save(); });
      lab.append(cb, document.createTextNode(m.once + ' used'));
      c.append(lab);
    }

    const controls = el('div', 'controls');
    const dmg = el('div', 'dmg');
    const amt = el('input'); amt.type = 'number'; amt.min = 1; amt.step = 1; amt.inputMode = 'numeric'; amt.placeholder = 'Amount';
    amt.setAttribute('aria-label', 'Amount for ' + m.name);
    const take = () => { const n = Math.floor(+amt.value); if (!(n > 0)) return 0; amt.value = ''; return n; };
    const hit = btn('Damage'); hit.addEventListener('click', () => { const n = take(); if (n) damage(m, n); });
    const heal = btn('Heal'); heal.addEventListener('click', () => { const n = take(); if (n) { delete lastHit[m.id]; setHp(m, hpOf(m) + n); } });
    amt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); hit.click(); } });
    dmg.append(amt, hit, heal);
    if (sb.fearOfFire) {
      const fire = btn('Fire', 'fire'); fire.title = 'Fire damage: applies it and shows the Fear of Fire check';
      fire.addEventListener('click', () => { const n = take(); if (n) damage(m, n, {fire: true}); });
      dmg.append(fire);
    }
    controls.append(dmg);
    // Redirect Attack: move the last hit Ghashnakh took onto an adjacent orc of your choice.
    if (sb.redirect) {
      const r = el('div', 'redirect'); r.hidden = true;
      const open = btn('Redirect last hit to an orc…');
      const pick = el('div', 'pick'); pick.hidden = true;
      open.addEventListener('click', () => {
        pick.textContent = '';
        for (const o of orcsNear(m, m)) {
          const b = btn(o.name); b.addEventListener('click', () => {
            const n = lastHit[m.id]; if (!(n > 0)) return;
            delete lastHit[m.id]; setHp(m, hpOf(m) + n); damage(o, n);
            note(o, `Took ${n} redirected from ${m.name}.` + (events[o.id] && /Hideous/.test(events[o.id]) ? ' ' + events[o.id] : ''));
            note(m, `Redirect Attack: ${o.name} took the ${n}.`);
            pick.hidden = true;
          });
          pick.append(b);
        }
        const cancel = btn('Cancel'); cancel.addEventListener('click', () => pick.hidden = true); pick.append(cancel);
        pick.hidden = false;
      });
      r.append(open, pick); controls.append(r);
    }
    const atk = attackSection(m);
    if (atk) controls.append(atk);
    c.append(controls);

    const revive = el('button', 'revive', 'Down · tap to revive'); revive.type = 'button';
    revive.setAttribute('aria-label', `${m.name} is down. Revive at 1 HP`);
    revive.addEventListener('click', () => setHp(m, 1));
    c.append(revive);
    return c;
  }

  /* ---------- initiative (zipper) ---------- */
  // Ben's house rule: everyone rolls, each side lines up highest to lowest, the side with the single
  // highest roll goes first, then turns alternate hero / monster down the line. A tie at the top goes
  // to the heroes. The order is set once and repeats every round.
  const fight = () => state.fight;
  const areaById = id => areas.find(a => a.id === id);
  const heroById = id => heroes.find(h => h.id === id);
  const fireHeal = a => {
    const healed = a.monsters.filter(o => sbOf(o).orc && hpOf(o) > 0 && hpOf(o) < o.hp);
    healed.forEach(o => setHp(o, hpOf(o) + a.fire.heal));
    return healed.length ? `+${a.fire.heal} HP: ${healed.map(o => o.name).join(', ')}` : 'No hurt orcs to heal.';
  };
  function zipper(h, m){
    const byRoll = (x, y) => y.roll - x.roll;           // stable sort keeps roster order on ties
    h = [...h].sort(byRoll); m = [...m].sort(byRoll);
    const out = []; let heroTurn = !m.length || (h.length && h[0].roll >= m[0].roll);
    while (h.length || m.length) {
      const from = (heroTurn && h.length) || !m.length ? h : m;
      out.push(from.shift()); heroTurn = from === m;
    }
    return out;
  }
  function startFight(a, heroRolls){
    const hs = heroes.filter(h => Number.isFinite(heroRolls[h.id])).map(h => ({t: 'hero', id: h.id, roll: heroRolls[h.id]}));
    const ms = a.monsters.filter(m => !m.terrain).map(m => ({t: 'monster', id: m.id, roll: die(20) + (sbOf(m).init || 0)}));
    // Zip only the monsters fighting from round 1, so round 1 alternates cleanly. Late joiners (Orc Guards 1–2,
    // Ghashnakh) then slot in after the last monster that rolled at least as high, keeping the monster side sorted.
    const late = e => (monsters[e.id].joinsRound || 1) > 1;
    const order = zipper(hs, ms.filter(e => !late(e)));
    for (const j of ms.filter(late).sort((x, y) => y.roll - x.roll)) {
      let at = -1;
      order.forEach((e, i) => { if (e.t === 'monster' && e.roll >= j.roll) at = i; });
      if (at === -1) { const firstM = order.findIndex(e => e.t === 'monster'); at = firstM === -1 ? order.length - 1 : firstM - 1; }
      order.splice(at + 1, 0, j);
    }
    // The courtyard fire acts once a round, at the end ("initiative 10" has no fixed spot in a zippered order).
    if (a.fire) order.push({t: 'fire', id: a.id, roll: 10});
    state.fight = {area: a.id, round: 1, turn: 0, order, arrived: []};
    if (!isActive(order[0], 1)) step(1, true);
    save(); render(); scrollToTurn();
  }
  const entryMonster = e => e.t === 'monster' ? monsters[e.id] : null;
  // Who gets a turn: heroes always (they make death saves too); monsters while standing and once they've joined; the fire until scattered.
  function isActive(e, round){
    if (e.t === 'hero') return true;
    if (e.t === 'fire') return !state.fireOut[e.id];
    const m = monsters[e.id]; return hpOf(m) > 0 && (m.joinsRound || 1) <= round;
  }
  function step(dir, quiet){
    const f = fight(), n = f.order.length; if (!n) return;
    let i = f.turn, r = f.round;
    for (let tries = 0; tries < n * 2; tries++) {
      i += dir;
      if (i >= n) { i = 0; r++; }
      if (i < 0) { if (r === 1) { i = f.turn; break; } i = n - 1; r--; }
      if (isActive(f.order[i], r)) break;
    }
    f.turn = i; f.round = r;
    const e = f.order[i];
    if (e.t === 'fire' && dir > 0 && !quiet) fireNote = fireHeal(areaById(e.id));
    save(); if (!quiet) { paintTurn(); scrollToTurn(); }
  }
  let fireNote = '';
  function balrogArrives(id){
    const f = fight(), m = monsters[id];
    // It bursts in and acts right after whoever is up now, then keeps that spot every round.
    f.order.splice(f.turn + 1, 0, {t: 'monster', id, roll: die(20) + (sbOf(m).init || 0)});
    f.arrived.push(id);
    save(); render(); scrollToTurn();
  }
  function endFight(){ state.fight = null; fireNote = ''; save(); render(); }

  // The sticky turn bar: round, who's up, who's next, and the buttons to move on.
  function renderTurnBar(){
    const box = $('#turn'); box.textContent = '';
    const f = fight(); box.hidden = !f; if (!f) return;
    const a = areaById(f.area);
    const nameOf = e => e.t === 'hero' ? heroById(e.id).name : e.t === 'fire' ? 'The fire' : monsters[e.id].name;
    const now = f.order[f.turn];
    let next = null;
    for (let k = 1; k <= f.order.length; k++) {
      const idx = (f.turn + k) % f.order.length, round = f.round + (f.turn + k >= f.order.length ? 1 : 0);
      if (isActive(f.order[idx], round)) { next = f.order[idx]; break; }
    }
    const info = el('p', 'turn-info');
    info.append(el('span', 'turn-round', `Round ${f.round}`), el('b', null, nameOf(now)), el('span', 'turn-next', next ? `Next: ${nameOf(next)}` : ''));
    const row = el('div', 'turn-btns');
    const back = btn('Back'); back.addEventListener('click', () => step(-1)); back.disabled = f.round === 1 && f.turn === firstActive();
    const go = btn('Next turn', 'next'); go.addEventListener('click', () => step(1));
    row.append(back, go);
    for (const id of (a.arrivals || [])) if (!f.arrived.includes(id)) {
      const b = btn(`${monsters[id].name.replace(/^The /, '')} arrives`, 'danger'); b.addEventListener('click', () => balrogArrives(id)); row.append(b);
    }
    box.append(info, row);
  }
  const firstActive = () => fight().order.findIndex(e => isActive(e, 1));
  function paintTurn(){
    const f = fight(); if (!f) return;
    document.querySelectorAll('.entry').forEach(n => {
      const e = f.order[+n.dataset.idx];
      n.classList.toggle('now', +n.dataset.idx === f.turn);
      n.classList.toggle('waiting', e.t === 'monster' && (monsters[e.id].joinsRound || 1) > f.round);
      if (e.t === 'fire') n.querySelector('.fire-note').textContent = state.fireOut[e.id] ? 'Scattered: no more healing.' : (+n.dataset.idx === f.turn ? fireNote : '');
    });
    renderTurnBar();
  }
  function scrollToTurn(){
    const n = document.querySelector('.entry.now'); if (!n) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    n.scrollIntoView({block: 'center', behavior: reduce ? 'auto' : 'smooth'});
  }

  function heroRow(h){
    const r = el('div', 'hero-row');
    r.append(el('b', null, h.name), el('span', 'hero-player', h.player), el('span', 'ac', 'AC ' + h.ac));
    return r;
  }
  function fightList(a){
    const f = fight(), list = el('ol', 'order');
    f.order.forEach((e, idx) => {
      const li = el('li', 'entry ' + e.t); li.dataset.idx = idx;
      const tag = el('span', 'init', String(e.roll)); tag.title = 'Initiative';
      if (e.t === 'hero') li.append(tag, heroRow(heroById(e.id)));
      else if (e.t === 'fire') {
        const r = el('div', 'hero-row fire-entry');
        r.append(el('b', null, 'The fire'), el('span', 'hero-player', `heals orcs +${a.fire.heal}`), el('span', 'fire-note'));
        li.append(el('span', 'init', 'end'), r);
      } else {
        const m = monsters[e.id];
        if (m.joinsRound > 1) li.append(el('span', 'joins', `joins round ${m.joinsRound}`));
        li.append(tag, card(m));
      }
      list.append(li);
    });
    // Terrain (the rotten floor) has HP but no turn: listed under the order once its area is in the fight.
    const terrainAreas = new Set([a.id, ...f.arrived.map(id => areaOfMonster(monsters[id]).id)]);
    const terrain = areas.filter(x => terrainAreas.has(x.id)).flatMap(x => x.monsters.filter(m => m.terrain));
    const wrap = el('div'); wrap.append(list);
    if (terrain.length) { const t = el('div', 'cards'); terrain.forEach(m => t.append(card(m))); wrap.append(el('h3', 'terrain-head', 'Terrain'), t); }
    return wrap;
  }
  function fightSetup(a, open){
    const box = el('div', 'setup'); box.hidden = true;
    box.append(el('p', 'setup-help', 'Type each hero’s initiative roll. Leave a box empty if that hero isn’t in this fight. Monsters roll their own.'));
    const grid = el('div', 'setup-grid'); const inputs = {};
    for (const h of heroes) {
      const lab = el('label', 'setup-hero'); const i = el('input'); i.type = 'number'; i.inputMode = 'numeric'; i.min = 1; i.max = 40; i.placeholder = 'Roll';
      lab.append(el('span', null, `${h.name} · ${h.player}`), i); inputs[h.id] = i; grid.append(lab);
    }
    const go = btn('Roll monsters & start', 'next'), cancel = btn('Cancel');
    go.addEventListener('click', () => {
      const rolls = {}; for (const [id, i] of Object.entries(inputs)) { const v = parseInt(i.value, 10); if (Number.isFinite(v)) rolls[id] = v; }
      startFight(a, rolls);
    });
    cancel.addEventListener('click', () => { box.hidden = true; open.focus(); });
    const btns = el('div', 'setup-btns'); btns.append(go, cancel);
    box.append(grid, btns);
    open.addEventListener('click', () => { box.hidden = false; inputs[heroes[0].id].focus(); });
    return box;
  }

  function areaSection(a){
    const sec = el('section', 'area'); sec.dataset.area = a.id;
    const head = el('div', 'area-head'); head.append(el('h2', null, a.name));
    const f = fight(), fightingHere = f && f.area === a.id;
    const reset = btn('Reset area');
    // The courtyard fire: once a round (the fight's last turn, or the manual button outside a fight) heals every standing orc 1 HP, until scattered.
    let fireRow = null;
    if (a.fire) {
      fireRow = el('div', 'fire-row');
      const tick = btn(`Fire tick +${a.fire.heal}`, 'fire'); tick.title = a.fire.when; tick.hidden = fightingHere;
      const out = el('span', 'fire-out'); out.setAttribute('aria-live', 'polite');
      const lab = el('label', 'once'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!state.fireOut[a.id];
      const sync = () => { tick.disabled = cb.checked; if (cb.checked) out.textContent = 'Fire scattered: no more healing.'; };
      cb.addEventListener('change', () => { if (cb.checked) state.fireOut[a.id] = true; else { delete state.fireOut[a.id]; out.textContent = ''; } save(); sync(); paintTurn(); });
      lab.append(cb, document.createTextNode('Fire scattered'));
      tick.addEventListener('click', () => { out.textContent = fireHeal(a); });
      fireRow.append(tick, lab, out); sync();
    }
    // Start fight / End fight. Only one fight runs at a time.
    let setup = null, endAsk = null;
    if (fightingHere) {
      const end = btn('End fight');
      endAsk = el('div', 'confirm'); endAsk.hidden = true;
      const yesEnd = btn('End fight', 'danger'), noEnd = btn('Cancel');
      endAsk.append(el('span', null, 'End this fight? HP stays as it is.'), yesEnd, noEnd);
      end.addEventListener('click', () => { endAsk.hidden = false; noEnd.focus(); });
      noEnd.addEventListener('click', () => { endAsk.hidden = true; end.focus(); });
      yesEnd.addEventListener('click', endFight);
      head.append(end);
    } else if (!f && a.monsters.some(m => !m.terrain)) {
      const startBtn = btn('Start fight', 'next'); head.append(startBtn);
      setup = fightSetup(a, startBtn);
    }
    head.append(reset);
    // In-page confirm instead of window.confirm.
    const ask = el('div', 'confirm'); ask.hidden = true;
    const yes = btn('Reset', 'danger'), no = btn('Cancel');
    ask.append(el('span', null, `Reset ${a.name} to full HP and clear its checkboxes?`), yes, no);
    reset.addEventListener('click', () => { ask.hidden = false; no.focus(); });
    no.addEventListener('click', () => { ask.hidden = true; reset.focus(); });
    yes.addEventListener('click', () => {
      for (const m of a.monsters) {
        delete state.hp[m.id]; delete state.used[m.id]; delete state.cleansed[m.id];
        delete events[m.id]; delete lastHit[m.id];
        for (const c of (m.cues || [])) delete state.dismissed[cueKey(m, c)];
      }
      delete state.fireOut[a.id];
      if (fightingHere) { state.fight = null; fireNote = ''; }
      save(); ask.hidden = true; render();
    });
    sec.append(head, ask);
    if (endAsk) sec.append(endAsk);
    if (setup) sec.append(setup);
    if (fireRow) sec.append(fireRow);
    // Monsters that arrived in another area's fight are shown there, not twice.
    // (an arrival brings its area's terrain with it, e.g. the Balrog and the rotten floor).
    const elsewhere = f && f.area !== a.id ? new Set(f.arrived) : new Set();
    const moved = a.monsters.some(m => elsewhere.has(m.id)) ? a.monsters.filter(m => elsewhere.has(m.id) || m.terrain) : [];
    if (moved.length) sec.append(el('p', 'empty', `${moved.map(m => m.name).join(' and ')} joined the ${areaById(f.area).name} fight; see it there.`));
    if (fightingHere) sec.append(fightList(a));
    else {
      const grid = el('div', 'cards');
      for (const m of a.monsters) if (!moved.includes(m)) grid.append(card(m));
      sec.append(grid);
    }
    return sec;
  }

  function renderFilters(){
    const box = $('#filters'); box.textContent = '';
    const opts = [{id: 'all', label: 'All'}, ...areas.map((a, i) => ({id: a.id, label: 'Area ' + (i + 1)}))];
    if (!opts.some(o => o.id === view)) view = 'all';
    for (const o of opts) {
      const b = btn(o.label); b.setAttribute('aria-pressed', o.id === view);
      b.addEventListener('click', () => { view = o.id; store(VIEW_KEY, view); renderFilters(); applyView(); });
      box.append(b);
    }
  }
  // During a fight only the fight's area shows and the area buttons hide, keeping the pinned bar small.
  function applyView(){
    const f = fight(), shown = f ? f.area : view;
    $('#filters').hidden = !!f;
    document.querySelectorAll('.area').forEach(s => s.hidden = shown !== 'all' && s.dataset.area !== shown);
  }

  function render(){
    const main = $('#areas'); main.textContent = '';
    for (const a of areas) main.append(areaSection(a));
    for (const m of Object.values(monsters)) paintCard(m);
    renderFilters(); applyView(); renderCues(); paintTurn(); renderTurnBar();
  }

  // monsters.json is the roster. The last good copy is kept so a dropped connection still opens the page.
  async function start(){
    let data;
    try {
      const r = await fetch('/monsters.json', {cache: 'no-cache'});
      if (!r.ok) throw new Error('http ' + r.status);
      data = await r.json(); store(ROSTER_KEY, data);
    } catch (e) { data = load(ROSTER_KEY, null); }
    if (!data || !Array.isArray(data.areas)) { $('#areas').textContent = 'Couldn’t load monsters.json.'; return; }
    areas = data.areas; statblocks = data.statblocks || {}; heroes = data.heroes || [];
    for (const a of areas) for (const m of a.monsters) monsters[m.id] = m;
    render();
  }
  start();
})();
</script>
</body>
</html>
